<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda, Astrea: protótipo</title>
<link rel="stylesheet" href="astrea.css">
<script src="moldura.js"></script>
<script src="componentes.js"></script>
<script src="dados.js"></script>
<style>
  /* Agenda: a grade e a lista de prioridades lado a lado; abaixo de 1180px a lista desce. */
  .agenda {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--size-column);
    align-items: start;
    gap: var(--space-5);
  }
  .agenda-barra {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--space-2) var(--space-4);
    margin-bottom: var(--space-3);
  }
  .agenda-navegar { display: flex; align-items: center; gap: var(--space-2); }
  .agenda-criar { margin-left: auto; }
  .agenda-periodo {
    margin: 0;
    font-size: var(--font-size-emphasis);
    font-weight: var(--font-weight-medium);
    line-height: var(--font-leading-tight);
  }

  /* abas das visões: sublinhado na ativa, como nas abas de Alertas */
  .visoes { display: flex; gap: var(--space-1); border-bottom: var(--border-width) solid var(--color-border-default); }
  .visao {
    height: var(--size-control);
    padding: 0 var(--space-3);
    background: none;
    border: 0;
    border-bottom: var(--focus-width) solid transparent;
    color: var(--color-text-muted);
    font: inherit;
    font-size: var(--font-size-button);
    font-weight: var(--font-weight-medium);
    cursor: pointer;
  }
  .visao:hover { color: var(--color-text-default); }
  .visao[aria-selected="true"] { border-bottom-color: var(--color-action); color: var(--color-action); font-weight: var(--font-weight-semibold); }

  /* A grade ocupa a altura que sobra na tela e rola por dentro; o JS mede --grade-altura (pedido de Felipe, 08/11). */
  /* position: relative prende o texto visualmente oculto das linhas na rolagem da grade; sem ele, a lista estica a página. */
  .grade-agenda { position: relative; min-width: 0; height: var(--grade-altura, auto); overflow: auto; }
  .agenda-vazio { margin-bottom: var(--space-3); }
  /* Busca: a contagem fica entre a barra e a grade, e some quando não há busca. */
  .agenda-contagem { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-label); }
  .agenda-contagem:not(:empty) { margin-bottom: var(--space-2); }

  /* mês e semana: sete colunas, domingo a sábado */
  .mes-semana, .mes-dias, .semana-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .mes-semana { border-bottom: var(--border-width) solid var(--color-border-default); }
  .mes-semana span {
    padding: var(--space-1) var(--space-2);
    color: var(--color-text-muted);
    font-size: var(--font-size-label);
    font-weight: var(--font-weight-semibold);
    letter-spacing: var(--font-tracking-caps);
    text-transform: uppercase;
  }
  .mes-dias, .semana-dias { margin: 0; padding: 0; list-style: none; border-left: var(--border-width) solid var(--color-border-default); }
  /* PA-47: a célula do mês tem três linhas da densidade compacta, e o mês inteiro cabe em 1440 por 900 */
  /* O mês e a semana preenchem a altura que sobra na tela; as linhas da hora têm o dobro da altura compacta (pedido de Felipe, 08/11). */
  .mes-dias { grid-auto-rows: minmax(calc(var(--density-row-compact) * 3), 1fr); min-height: calc(var(--grade-altura, 640px) - var(--density-row-compact)); }
  .dia {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    min-width: 0;
    padding: var(--space-1);
    overflow: hidden;
    border-right: var(--border-width) solid var(--color-border-default);
    border-bottom: var(--border-width) solid var(--color-border-default);
  }
  /* Semana: rótulos de hora à esquerda e sete dias. A cabeça dos dias e o "Dia todo"
     ficam presos no topo da grade enquanto as horas rolam (pedido de Felipe, 08/11). */
  .semana-topo, .semana-horas { display: grid; grid-template-columns: calc(var(--size-control) * 2) minmax(0, 1fr); }
  .semana-topo {
    position: sticky;
    top: 0;
    z-index: 1;
    background-color: var(--color-bg-page);
    border-top: var(--border-width) solid var(--color-border-default);
  }
  .semana-canto {
    padding: calc(var(--space-2) + var(--size-chip) + var(--space-1)) var(--space-2) 0 0;
    color: var(--color-text-muted);
    font-size: var(--font-size-label);
    text-align: right;
    white-space: nowrap;
  }
  .semana-dias .dia { min-height: calc(var(--density-row-compact) * 2); padding: var(--space-2); }
  .semana-dias .itens-dia { max-height: calc(var(--density-row-compact) * 3); overflow-y: auto; }
  .semana-colunas { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: var(--border-width) solid var(--color-border-default); }
  .semana-colunas .horas { border-right: var(--border-width) solid var(--color-border-default); }
  .horas.semana-rotulos li { justify-content: flex-end; padding: var(--space-1) var(--space-2) 0 0; }
  .dia-numero {
    display: inline-grid;
    place-items: center;
    align-self: flex-start;
    min-width: var(--size-chip);
    height: var(--size-chip);
    padding: 0 var(--space-1);
    border-radius: var(--radius-round);
    color: var(--color-text-default);
    font-size: var(--font-size-label);
    font-weight: var(--font-weight-semibold);
    font-variant-numeric: tabular-nums;
  }
  .dia-fora .dia-numero { color: var(--color-text-muted); }
  .dia-hoje .dia-numero { background-color: var(--color-action); color: var(--color-action-text); }
  .semana-cabeca { display: flex; align-items: center; gap: var(--space-2); color: var(--color-text-muted); font-size: var(--font-size-label); text-transform: uppercase; }

  /* atividade dentro da célula: o texto diz o estado, a cor reforça (PA-34) */
  .itens-dia { display: grid; gap: var(--space-1); margin: 0; padding: 0; list-style: none; min-width: 0; }
  .itens-dia > li { min-width: 0; }
  .item-dia {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 0 var(--space-1);
    overflow: hidden;
    background-color: var(--component-chip-bg);
    border: 0;
    border-left: var(--focus-width) solid var(--color-border-strong);
    border-radius: 0;
    color: var(--color-text-default);
    font: inherit;
    font-size: var(--font-size-label);
    line-height: var(--font-leading-base);
    text-align: start;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .item-dia:hover { box-shadow: inset 0 0 0 var(--border-width) var(--color-border-strong); }
  .item-dia:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: calc(-1 * var(--focus-width)); }
  .semana-dias .item-dia { white-space: normal; }
  .item-dia[data-prazo="vencido"] { background-color: var(--color-bg-danger); border-left-color: var(--color-text-danger); }
  .item-dia[data-prazo="hoje"] { background-color: var(--color-bg-warning); border-left-color: var(--color-text-warning); }
  .item-dia[data-prazo="concluido"] { background-color: var(--color-bg-surface); color: var(--color-text-muted); }
  .item-estado { font-weight: var(--font-weight-semibold); }
  .item-mais { color: var(--color-text-muted); font-size: var(--font-size-label); }

  /* dia: atividades sem hora em "Dia todo", e a grade de horas abaixo */
  .dia-todo h3, .lista-dia h3, .prioridades h2 {
    margin: 0 0 var(--space-2);
    font-size: var(--font-size-emphasis);
    font-weight: var(--font-weight-medium);
    line-height: var(--font-leading-tight);
  }
  .dia-todo { padding-bottom: var(--space-3); border-bottom: var(--border-width) solid var(--color-border-default); }
  .dia-sem-item { margin: 0; color: var(--color-text-muted); }
  .horas { margin: 0; padding: 0; list-style: none; }
  .horas li {
    display: flex;
    min-height: calc(var(--density-row-compact) * 2);
    padding: 0;
    border-bottom: var(--border-width) solid var(--color-border-default);
    color: var(--color-text-muted);
    font-size: var(--font-size-label);
    font-variant-numeric: tabular-nums;
  }
  .hora-botao { flex: 1; align-self: stretch; padding: var(--space-1) var(--space-2); background: none; border: 0; border-radius: var(--radius); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .hora-botao:hover { background-color: var(--color-bg-subtle); }
  .hora-botao:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: calc(-1 * var(--focus-width)); }
  .lista-dia + .lista-dia { margin-top: var(--space-4); }

  /* Coluna da direita: o detalhe do item escolhido em cima, as prioridades embaixo, na altura da grade. */
  .agenda-lado {
    position: sticky;
    top: calc(var(--component-header-height) + var(--space-5));
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    min-width: 0;
    max-height: var(--grade-altura, calc(100vh - var(--component-header-height) - 2 * var(--space-5)));
  }
  .agenda-lado > [hidden] { display: none; }
  /* O detalhe ocupa a altura que precisa; as prioridades ficam com o resto, com no mínimo quatro linhas. */
  .agenda-lado .painel-detalhe {
    position: static;
    display: flex;
    flex: none;
    max-height: calc(var(--grade-altura, 640px) - var(--density-row-compact) * 4 - var(--space-3));
  }
  .agenda-lado .painel-detalhe-card { flex: 1 1 auto; max-height: none; min-height: 0; }
  .agenda-lado .painel-detalhe-reabrir { display: none; }
  .painel-detalhe-rodape a.botao { text-decoration: none; }
  .detalhe-processo { display: inline-flex; align-items: center; gap: var(--space-1); }
  .acao-redonda { border-radius: var(--radius-round); border-color: var(--color-border-strong); background-color: var(--color-bg-page); color: var(--color-text-default); }
  .acao-redonda:hover, .acao-redonda:focus-visible { border-color: var(--color-action); }
  /* No rodapé do painel a dica abre para cima, senão corta na borda. */
  .tooltip:has(> .acao-redonda) .dica { top: auto; right: auto; left: 50%; bottom: 100%; margin: 0 0 var(--space-1); transform: translateX(-50%); }

  /* Item escolhido: a mesma marca da Área de trabalho, na linha, no item da grade e na prioridade. */
  .linha-atividade[data-id] { cursor: pointer; }
  .linha-atividade[data-id]:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: calc(-1 * var(--focus-width)); }
  .linha-atividade.is-selecionado { background-color: var(--color-bg-hover); box-shadow: inset calc(var(--focus-width) + var(--border-width)) 0 0 var(--color-action); }
  .item-dia.is-selecionado, .prioridade-botao.is-selecionado { box-shadow: inset 0 0 0 var(--border-width) var(--color-action); }

  /* PA-48: prazos a vencer numa lista só, ao lado da grade */
  .prioridades {
    flex: 1 1 auto;
    min-height: calc(var(--density-row-compact) * 4);
    padding: var(--space-4);
    background-color: var(--component-card-bg);
    border: var(--border-width) solid var(--component-card-border);
    border-radius: var(--radius-card);
    overflow-y: auto;
  }
  .prioridades-ajuda { margin: 0 0 var(--space-3); color: var(--color-text-muted); font-size: var(--font-size-label); }
  .prioridades ol { display: grid; gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  .prioridade-botao { display: grid; gap: var(--space-1); justify-items: start; width: 100%; padding: var(--space-2); background: none; border: var(--border-width) solid transparent; border-radius: var(--radius); color: inherit; font: inherit; text-align: start; cursor: pointer; }
  .prioridade-botao:hover { border-color: var(--color-action); background-color: var(--color-bg-subtle); }
  .prioridade-botao:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: var(--focus-offset); }
  .prioridade { display: grid; justify-items: start; gap: var(--space-1); }
  .prioridade-titulo { font-weight: var(--font-weight-medium); overflow-wrap: anywhere; }

  /* Filtros ao lado da busca, com rótulo fixo. A barra de cima tem visões, busca, filtros e Criar;
     a linha de baixo tem o período, a contagem e o Limpar filtros (a barra inteira não cabe em 1440). */
  .agenda-filtros { display: flex; align-items: flex-end; gap: var(--space-3); }
  .agenda-resultado { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); margin-bottom: var(--space-3); }
  .agenda-resultado .agenda-contagem:not(:empty) { margin-bottom: 0; }
  @media (min-width: 1101px) {
    .agenda-barra { flex-wrap: nowrap; }
    .agenda-buscar { flex: 0 1 var(--component-field-width-p); min-width: calc(var(--component-field-width-p) * 0.7); }
    .agenda-buscar .campo { width: 100%; }
    .agenda-filtros { flex: 0 1 calc(var(--component-field-width-p) * 2 + var(--space-3)); min-width: 0; }
    .agenda-filtros .campo { flex: 1 1 0; width: auto; min-width: calc(var(--component-field-width-p) * 0.7); max-width: var(--component-field-width-p); }
    .agenda-criar { flex: none; }
  }

  @media (max-width: 1180px) {
    .agenda { grid-template-columns: minmax(0, 1fr); }
    .agenda-lado { position: static; max-height: none; }
  }
</style>
</head>
<body data-pagina="agenda.html" data-titulo="Agenda">
<div class="corpo">
  <main id="conteudo">
    <div class="agenda-barra" id="agenda-barra">
      <div class="visoes" role="tablist" aria-label="Visão da agenda" id="visoes"></div>
      <div class="agenda-buscar" id="agenda-buscar"></div>
      <div class="agenda-filtros" id="agenda-filtros" role="group" aria-label="Filtros da agenda"></div>
      <div class="agenda-criar" id="agenda-criar"></div>
    </div>
    <div class="agenda-resultado">
      <div class="agenda-navegar" id="agenda-navegar"></div>
      <h2 class="agenda-periodo" id="agenda-periodo" aria-live="polite"></h2>
      <p class="agenda-contagem" id="agenda-contagem" role="status"></p>
      <span id="agenda-limpar"></span>
    </div>
    <div class="agenda">
      <section class="grade-agenda" id="grade-agenda" tabindex="-1" role="tabpanel" aria-labelledby="visao-dia"></section>
      <div class="agenda-lado" id="agenda-lado">
        <aside class="prioridades" aria-labelledby="prioridades-titulo">
          <h2 id="prioridades-titulo">Prioridades por prazo</h2>
          <p class="prioridades-ajuda">Tudo que está em aberto, do prazo mais urgente ao mais distante.</p>
          <div id="prioridades-lista"></div>
        </aside>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  const VISOES = [
    { id: 'lista', rotulo: 'Em lista' },
    { id: 'dia', rotulo: 'Por dia' },
    { id: 'semana', rotulo: 'Por semana' },
    { id: 'mes', rotulo: 'Por mês' },
  ];
  const TIPOS = { tarefa: 'Tarefa', prazo: 'Prazo', audiencia: 'Audiência', evento: 'Evento' };
  const DIAS_DA_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const LIMITE_DO_MES = 2;
  const HORAS = Array.from({ length: 11 }, (_, i) => 8 + i);

  const parametros = new URLSearchParams(location.search);
  const vazio = parametros.get('estado') === 'vazio';
  const hoje = semHora(new Date());

  // PA-49: abre sempre em Hoje, na visão por dia, sem ler a última sessão.
  const estado = { visao: 'dia', data: hoje };

  function semHora(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function somarDias(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function doisDigitos(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return `${d.getFullYear()}-${doisDigitos(d.getMonth() + 1)}-${doisDigitos(d.getDate())}`; }
  function mesmoDia(a, b) { return iso(a) === iso(b); }
  function inicial(texto) { return texto.charAt(0).toUpperCase() + texto.slice(1); }
  function curta(d) { return `${doisDigitos(d.getDate())}/${doisDigitos(d.getMonth() + 1)}`; }

  function criar(tag, classe, texto) {
    const el = document.createElement(tag);
    if (classe) el.className = classe;
    if (texto !== undefined) el.textContent = texto;
    return el;
  }

  function naAgenda(a) {
    const concluida = a.status === 'concluido';
    return { ...a, data: somarDias(hoje, a.prazoEmDias), concluida, ...DS.descreverPrazo(a.prazoEmDias, concluida) };
  }

  const ATIVIDADES = (vazio ? [] : window.DADOS.ATIVIDADES).map(naAgenda);

  // Busca por título, número do processo ou responsável, sem acento e sem maiúscula
  // (Felipe: "vai que sabe o código do processo ou o nome da pessoa").
  const busca = { termo: '' };
  function normalizar(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
  function soDigitos(t) { return String(t || '').replace(/\D/g, ''); }
  function buscando() { return normalizar(busca.termo) !== ''; }
  function casa(a) {
    const termo = normalizar(busca.termo);
    if (!termo) return true;
    if ([a.titulo, a.processo, a.responsavel].some((c) => normalizar(c).includes(termo))) return true;
    // Número digitado sem pontos ou com pontuação diferente: compara só os dígitos.
    const digitos = soDigitos(termo);
    return /^[\d\s.\-/]+$/.test(termo) && digitos !== '' && soDigitos(a.processo).includes(digitos);
  }
  // Filtros de pessoa e de tipo, como no Astrea; a escolha volta ao abrir a página.
  // Valor gravado fora das opções volta ao padrão: a pessoa pode ter saído da conta.
  const CHAVE_FILTROS = 'astrea-agenda-filtros';
  const FILTROS = {
    responsavel: {
      rotulo: 'Responsável',
      opcoes: [['todas', 'Todas as pessoas'], ...[...window.DADOS.RESPONSAVEIS].sort().map((nome) => [nome, nome])],
      aceita: (valor, a) => valor === 'todas' || a.responsavel === valor,
    },
    tipo: {
      rotulo: 'Tipo',
      opcoes: [['todos', 'Todos'], ...Object.entries(TIPOS)],
      aceita: (valor, a) => valor === 'todos' || a.tipo === valor,
    },
  };
  const PADRAO = Object.fromEntries(Object.entries(FILTROS).map(([chave, f]) => [chave, f.opcoes[0][0]]));
  const filtro = lerFiltros();

  function lerFiltros() {
    let salvo = {};
    try { salvo = JSON.parse(localStorage.getItem(CHAVE_FILTROS)) || {}; } catch (e) { salvo = {}; }
    return Object.fromEntries(Object.entries(FILTROS).map(([chave, f]) => {
      const valido = f.opcoes.some(([opcao]) => opcao === salvo[chave]);
      return [chave, valido ? salvo[chave] : PADRAO[chave]];
    }));
  }
  function gravarFiltros() {
    try { localStorage.setItem(CHAVE_FILTROS, JSON.stringify(filtro)); } catch (e) { /* sem armazenamento */ }
  }
  function filtrando() { return Object.keys(FILTROS).some((chave) => filtro[chave] !== PADRAO[chave]); }
  function passa(a) { return Object.entries(FILTROS).every(([chave, f]) => f.aceita(filtro[chave], a)); }

  function visiveis() { return ATIVIDADES.filter((a) => casa(a) && passa(a)); }

  function doDia(d) { return visiveis().filter((a) => mesmoDia(a.data, d)); }

  // --- peças das visões ----------------------------------------------------

  // Clique e Enter abrem o detalhe; o número e o copiar da linha seguem sozinhos.
  function linha(a) {
    const el = DS.linhaAtividade({
      titulo: a.titulo, tipo: a.tipo, estadoPrazo: a.estadoPrazo, prazo: a.rotulo,
      processo: a.processo, hrefProcesso: a.processo ? urlDoProcesso(a.processo) : undefined,
      responsavel: a.responsavel, densidade: 'compacta',
    });
    el.dataset.id = a.id;
    el.tabIndex = 0;
    el.addEventListener('click', (e) => { if (!e.target.closest('button, a')) detalhe.abrir(a.id, el); });
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.target !== el) return;
      e.preventDefault();
      detalhe.abrir(a.id, el);
    });
    return el;
  }

  function listaDeLinhas(itens) {
    const ul = criar('ul', 'lista-atividades');
    ul.append(...itens.map(linha));
    return ul;
  }

  const PREFIXO = { vencido: 'Vencido', concluido: 'Concluída' };

  // Item da semana e do mês: botão que abre o detalhe ao lado (Enter e Espaço vêm do botão).
  function itemDoDia(a) {
    const li = criar('li');
    const botao = criar('button', 'item-dia');
    botao.type = 'button';
    botao.dataset.prazo = a.estadoPrazo;
    botao.dataset.id = a.id;
    botao.title = `${TIPOS[a.tipo]}, ${a.rotulo}: ${a.titulo}`;
    if (PREFIXO[a.estadoPrazo]) botao.append(criar('span', 'item-estado', `${PREFIXO[a.estadoPrazo]}: `));
    botao.append(`${TIPOS[a.tipo]} · ${a.titulo}`);
    botao.addEventListener('click', () => detalhe.abrir(a.id, botao));
    li.append(botao);
    return li;
  }

  function itensDoDia(itens, limite) {
    const ul = criar('ul', 'itens-dia');
    const mostrados = limite ? itens.slice(0, limite) : itens;
    ul.append(...mostrados.map(itemDoDia));
    if (itens.length > mostrados.length) ul.append(criar('li', 'item-mais', `mais ${itens.length - mostrados.length}`));
    return ul;
  }

  function numeroDoDia(d) {
    const numero = criar('span', 'dia-numero', String(d.getDate()));
    if (mesmoDia(d, hoje)) numero.append(criar('span', 'visualmente-oculto', ', hoje'));
    return numero;
  }

  function celula(d, classeExtra) {
    const li = criar('li', 'dia' + (classeExtra || ''));
    if (mesmoDia(d, hoje)) li.classList.add('dia-hoje');
    li.dataset.dia = iso(d);
    return li;
  }

  function cabecaDaSemana() {
    const cabeca = criar('div', 'mes-semana');
    cabeca.setAttribute('aria-hidden', 'true');
    cabeca.append(...DIAS_DA_SEMANA.map((n) => criar('span', null, n)));
    return cabeca;
  }

  function inicioDaSemana(d) { return somarDias(d, -d.getDay()); }

  // --- visões --------------------------------------------------------------

  function visaoMes(ref) {
    const primeiro = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const ultimo = new Date(ref.getFullYear(), ref.getMonth() + 1, 0);
    const inicio = inicioDaSemana(primeiro);
    const total = Math.ceil((primeiro.getDay() + ultimo.getDate()) / 7) * 7;
    const dias = criar('ul', 'mes-dias');
    dias.setAttribute('aria-label', 'Dias do mês');
    for (let i = 0; i < total; i++) {
      const d = somarDias(inicio, i);
      const li = celula(d, d.getMonth() === ref.getMonth() ? '' : ' dia-fora');
      li.append(numeroDoDia(d));
      const itens = doDia(d);
      if (itens.length) li.append(itensDoDia(itens, LIMITE_DO_MES));
      dias.append(li);
    }
    return [cabecaDaSemana(), dias];
  }

  // Clicar numa hora abre o painel de criar atividade já no dia da coluna (pedido de Felipe, 08/11).
  function botaoDeHora(h, d, texto, rotulo) {
    const li = criar('li');
    const botao = criar('button', 'hora-botao', texto);
    botao.type = 'button';
    botao.setAttribute('aria-label', `Criar atividade às ${doisDigitos(h)}:00 ${rotulo}`);
    botao.setAttribute('data-abre-painel', '');
    botao.dataset.hora = `${iso(d)}T${doisDigitos(h)}:00`;
    botao.addEventListener('click', () => DS.painelCriarAtividade({ tipo: 'evento', data: iso(d) }).abrir(botao));
    li.append(botao);
    return li;
  }

  function visaoSemana(ref) {
    const inicio = inicioDaSemana(ref);
    const dias = criar('ul', 'semana-dias');
    dias.setAttribute('aria-label', 'Dias da semana, atividades do dia todo');
    const colunas = criar('div', 'semana-colunas');
    for (let i = 0; i < 7; i++) {
      const d = somarDias(inicio, i);
      const li = celula(d);
      const cabeca = criar('div', 'semana-cabeca');
      cabeca.append(criar('span', null, DIAS_DA_SEMANA[i]), numeroDoDia(d));
      li.append(cabeca);
      const itens = doDia(d);
      if (itens.length) li.append(itensDoDia(itens));
      dias.append(li);

      const nome = d.toLocaleDateString('pt-BR', { weekday: 'long' });
      const horas = criar('ul', 'horas');
      horas.setAttribute('aria-label', `Horas de ${nome}, ${curta(d)}`);
      horas.append(...HORAS.map((h) => botaoDeHora(h, d, '', `de ${nome}, ${curta(d)}`)));
      colunas.append(horas);
    }
    const topo = criar('div', 'semana-topo');
    topo.append(criar('div', 'semana-canto', 'Dia todo'), dias);
    const rotulos = criar('ol', 'horas semana-rotulos');
    rotulos.setAttribute('aria-hidden', 'true');
    rotulos.append(...HORAS.map((h) => criar('li', null, `${doisDigitos(h)}:00`)));
    const corpo = criar('div', 'semana-horas');
    corpo.append(rotulos, colunas);
    return [topo, corpo];
  }

  function visaoDia(ref) {
    const todo = criar('section', 'dia-todo');
    todo.append(criar('h3', null, 'Dia todo'));
    const itens = doDia(ref);
    todo.append(itens.length ? listaDeLinhas(itens) : criar('p', 'dia-sem-item', 'Nenhuma atividade neste dia.'));
    const horas = criar('ul', 'horas');
    horas.setAttribute('aria-label', 'Horas do dia');
    horas.append(...HORAS.map((h) => botaoDeHora(h, ref, `${doisDigitos(h)}:00`, 'deste dia')));
    return [todo, horas];
  }

  function visaoLista(ref) {
    const ultimo = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
    const blocos = [];
    for (let dia = 1; dia <= ultimo; dia++) {
      const d = new Date(ref.getFullYear(), ref.getMonth(), dia);
      const itens = doDia(d);
      if (!itens.length) continue;
      const bloco = criar('section', 'lista-dia');
      const titulo = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
      bloco.append(criar('h3', null, inicial(titulo) + (mesmoDia(d, hoje) ? ', hoje' : '')), listaDeLinhas(itens));
      blocos.push(bloco);
    }
    if (!blocos.length && !vazio && !buscando()) blocos.push(criar('p', 'dia-sem-item', 'Nenhuma atividade neste mês.'));
    return blocos;
  }

  const DESENHO = { lista: visaoLista, dia: visaoDia, semana: visaoSemana, mes: visaoMes };

  function rotuloDoPeriodo(visao, ref) {
    const mes = inicial(ref.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
    if (visao === 'dia') return inicial(ref.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
    if (visao === 'semana') {
      const inicio = inicioDaSemana(ref);
      return `Semana de ${curta(inicio)} a ${curta(somarDias(inicio, 6))}`;
    }
    return mes;
  }

  // PA-46: no estado vazio a grade continua na tela, e o aviso ensina a usá-la.
  function avisoVazio() {
    const aviso = DS.estadoVazio({
      titulo: 'Nenhuma atividade na agenda',
      texto: 'Prazos, audiências, tarefas e eventos aparecem nesta grade, no dia em que vencem. '
        + 'Para criar a primeira, use Criar atividade, acima da grade.',
    });
    aviso.classList.add('agenda-vazio');
    return aviso;
  }

  // --- busca: contagem e vazio do período ----------------------------------

  const NO_PERIODO = { dia: 'neste dia', semana: 'nesta semana', lista: 'neste mês', mes: 'neste mês' };

  function limitesDoPeriodo(visao, ref) {
    if (visao === 'dia') return [ref, ref];
    if (visao === 'semana') { const inicio = inicioDaSemana(ref); return [inicio, somarDias(inicio, 6)]; }
    return [new Date(ref.getFullYear(), ref.getMonth(), 1), new Date(ref.getFullYear(), ref.getMonth() + 1, 0)];
  }

  function achadosNoPeriodo() {
    const [inicio, fim] = limitesDoPeriodo(estado.visao, estado.data);
    return visiveis().filter((a) => a.data >= inicio && a.data <= fim).length;
  }

  function contagem(n) {
    return `${n} ${n === 1 ? 'atividade' : 'atividades'} ${NO_PERIODO[estado.visao]}`;
  }

  function avisoBusca() {
    const total = visiveis().length;
    const titulo = buscando()
      ? `Nenhuma atividade para “${busca.termo.trim()}” ${NO_PERIODO[estado.visao]}`
      : `Nenhuma atividade com estes filtros ${NO_PERIODO[estado.visao]}`;
    const semNenhuma = buscando()
      ? 'A busca olha o título, o número do processo e o nome do responsável. Confira o que foi digitado ou limpe a busca.'
      : 'Nenhuma atividade da agenda tem esta pessoa e este tipo. Troque os filtros ou use Limpar filtros.';
    const aviso = DS.estadoVazio({
      titulo,
      texto: total ? `Há ${total} em outros períodos. Use as setas de período ou troque de visão.` : semNenhuma,
    });
    aviso.classList.add('agenda-vazio');
    return aviso;
  }

  // --- prioridades ---------------------------------------------------------

  function prioridades() {
    const destino = document.getElementById('prioridades-lista');
    const abertas = visiveis().filter((a) => !a.concluida).sort((a, b) => a.prazoEmDias - b.prazoEmDias);
    if (!abertas.length) {
      const motivo = buscando() ? `para “${busca.termo.trim()}”` : 'com estes filtros';
      destino.replaceChildren((buscando() || filtrando()) && ATIVIDADES.length
        ? DS.estadoVazio({ titulo: `Nenhum prazo em aberto ${motivo}`, texto: 'Limpe a busca e os filtros para ver todas as prioridades.' })
        : DS.estadoVazio({ titulo: 'Nenhum prazo em aberto', texto: 'Quando houver atividade a vencer, ela entra aqui pela ordem do prazo.' }));
      return;
    }
    const ol = criar('ol');
    ol.append(...abertas.map((a) => {
      const li = criar('li', 'prioridade');
      // Cada prioridade é ação: abre o dia da atividade na grade e o detalhe dela ao lado
      // (pergunta de Felipe: "isso é informativo?").
      const botao = criar('button', 'prioridade-botao');
      botao.type = 'button';
      botao.dataset.id = a.id;
      botao.setAttribute('aria-label', `Abrir ${a.titulo}, no dia dela`);
      botao.append(DS.chipPrazo({ estadoPrazo: a.estadoPrazo, rotulo: a.rotulo }), criar('span', 'prioridade-titulo', a.titulo), DS.tag({ rotulo: TIPOS[a.tipo] }));
      botao.addEventListener('click', () => {
        estado.data = a.data;
        trocar('dia');
        detalhe.abrir(a.id, botao);
      });
      li.append(botao);
      return li;
    }));
    destino.replaceChildren(ol);
    detalhe.sincronizar();
  }

  // --- detalhe do item, acima das prioridades (padrão da Área de trabalho) ---

  const NOME_DA_LISTA = { tarefa: 'Lista de tarefas', prazo: 'Lista de tarefas', audiencia: 'Agenda', evento: 'Agenda' };

  function urlDoProcesso(numero) {
    const i = (window.DADOS.PROCESSOS || []).findIndex((p) => p.numero === numero);
    return `processos.html?ficha=${i + 1 || 1}`;
  }

  // O mesmo botão de copiar da linha: o verificador lê data-acao="copiar-numero".
  function copiarNumero(numero) {
    const el = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'copiar', rotulo: 'Copiar número' });
    el.dataset.acao = 'copiar-numero';
    const envolto = DS.tooltip({ alvo: el, rotulo: 'Copiar número' });
    const dica = envolto.querySelector('.dica');
    el.addEventListener('click', () => {
      const area = navigator.clipboard;
      const avisar = (texto) => { if (dica) dica.textContent = texto; };
      if (!area) { avisar('Não foi possível copiar'); return; }
      area.writeText(numero).then(() => avisar('Número copiado'), () => avisar('Não foi possível copiar'));
    });
    return envolto;
  }

  function valorDoProcesso(numero) {
    if (!numero) return '';
    const el = criar('span', 'detalhe-processo');
    el.append(criar('span', 'numero-processo', numero), copiarNumero(numero));
    return el;
  }

  function acaoRedonda(acao) {
    const b = DS.botao({ variante: 'icone', iconeEsquerda: acao.icone, rotulo: acao.rotulo });
    b.classList.add('acao-redonda');
    b.dataset.acao = acao.chave;
    b.addEventListener('click', acao.aoClicar);
    return DS.tooltip({ alvo: b, rotulo: acao.rotulo });
  }

  // Concluir e Adiar mudam a atividade no lugar e redesenham a grade e as prioridades.
  function alterar(a, mudanca) {
    Object.assign(a, naAgenda({ ...a, ...mudanca }));
    desenhar();
    prioridades();
    const foco = document.querySelector(`#agenda-detalhe [data-acao="${mudanca.status ? 'concluir' : 'adiar'}"], #agenda-detalhe [data-acao="reabrir"]`);
    if (foco) foco.focus();
  }

  function acoesDe(a) {
    if (a.concluida) return [{ chave: 'reabrir', rotulo: 'Reabrir', icone: 'editar', aoClicar: () => alterar(a, { status: 'a-fazer' }) }];
    return [
      { chave: 'concluir', rotulo: 'Concluir', icone: 'marca', aoClicar: () => alterar(a, { status: 'concluido' }) },
      { chave: 'adiar', rotulo: 'Adiar 1 dia', icone: 'calendario', aoClicar: () => alterar(a, { prazoEmDias: a.prazoEmDias + 1 }) },
    ];
  }

  function dadosDoDetalhe(a, navegavel) {
    const linhas = [
      { icone: 'arquivar', rotulo: 'Processo', valor: valorDoProcesso(a.processo) },
      { icone: 'pessoa', rotulo: 'Responsável', valor: a.responsavel ? DS.avatar({ nome: a.responsavel, mostrarNome: true }) : '' },
      { icone: 'calendario', rotulo: 'Lista', valor: NOME_DA_LISTA[a.tipo] },
      { icone: 'marca', rotulo: 'Situação', valor: a.concluida ? 'Concluída' : 'Aberta' },
    ];
    const abrir = criar('a', 'botao botao-primario', 'Abrir processo');
    abrir.href = urlDoProcesso(a.processo);
    abrir.dataset.acao = 'abrir-processo';
    return {
      titulo: a.titulo,
      chips: [DS.chipPrazo({ estadoPrazo: a.estadoPrazo, rotulo: a.rotulo }), DS.tag({ rotulo: TIPOS[a.tipo] })],
      destaque: { rotulo: 'Prazo', valor: a.rotulo },
      linhas, corpo: [], acoes: [...acoesDe(a).map(acaoRedonda), ...(a.processo ? [abrir] : [])], navegavel,
    };
  }

  // Sem escolha, o painel fica escondido e a coluna mostra só as prioridades.
  // O × esconde o painel inteiro; o próximo clique num item o mostra de novo.
  // Se o filtro ou a busca tira a atividade escolhida, o painel some com ela.
  function criarDetalhe() {
    let escolhido = null;
    let origem = null;
    const ordem = () => visiveis().slice().sort((x, y) => x.prazoEmDias - y.prazoEmDias);
    const painel = DS.painelDetalhe({
      rotulo: 'Atividade escolhida',
      rotulos: { anterior: 'Atividade anterior', proximo: 'Próxima atividade',
        esconder: 'Fechar o detalhe da atividade', mostrar: 'Mostrar o detalhe da atividade' },
      aoAnterior: () => andar(-1),
      aoProximo: () => andar(1),
      aoFechar: fechar,
    });
    painel.el.id = 'agenda-detalhe';
    painel.el.hidden = true;
    document.getElementById('agenda-lado').prepend(painel.el);

    function andar(passo) {
      const itens = ordem();
      const i = Math.max(0, itens.findIndex((a) => a.id === escolhido));
      abrir(itens[(i + passo + itens.length) % itens.length].id, null);
    }

    function fechar() {
      escolhido = null;
      painel.el.hidden = true;
      marcar('');
      if (origem && origem.isConnected) origem.focus(); else gradeEl.focus({ preventScroll: true });
    }

    function marcar(id) {
      document.querySelectorAll('#grade-agenda [data-id], #prioridades-lista [data-id]').forEach((el) => {
        const sim = el.dataset.id === id;
        el.classList.toggle('is-selecionado', sim);
        if (sim) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
      });
    }

    function sincronizar() {
      const itens = ordem();
      const a = itens.find((x) => x.id === escolhido);
      if (!a) { if (escolhido) { escolhido = null; painel.el.hidden = true; } marcar(''); return; }
      painel.mostrar(dadosDoDetalhe(a, itens.length > 1));
      marcar(a.id);
    }

    function abrir(id, gatilho) {
      if (!visiveis().some((a) => a.id === id)) return;
      escolhido = id;
      if (gatilho) origem = gatilho;
      if (painel.oculto()) painel.reabrir();
      painel.el.hidden = false;
      sincronizar();
    }

    return { abrir, sincronizar };
  }

  // --- barra: abas e navegação ---------------------------------------------

  const grade = document.getElementById('grade-agenda');
  const abas = VISOES.map((v) => {
    const aba = criar('button', 'visao', v.rotulo);
    aba.type = 'button';
    aba.id = `visao-${v.id}`;
    aba.dataset.visao = v.id;
    aba.setAttribute('role', 'tab');
    aba.setAttribute('aria-controls', 'grade-agenda');
    aba.addEventListener('click', () => trocar(v.id));
    return aba;
  });

  function trocar(visao, focar) {
    estado.visao = visao;
    desenhar();
    if (focar) abas.find((a) => a.dataset.visao === visao).focus();
  }

  // Abas com foco itinerante: Tab entra na aba ativa, as setas trocam de visão.
  document.getElementById('visoes').append(...abas);
  document.getElementById('visoes').addEventListener('keydown', (e) => {
    const atual = VISOES.findIndex((v) => v.id === estado.visao);
    const destino = { ArrowRight: atual + 1, ArrowLeft: atual - 1, Home: 0, End: VISOES.length - 1 }[e.key];
    if (destino === undefined) return;
    e.preventDefault();
    trocar(VISOES[(destino + VISOES.length) % VISOES.length].id, true);
  });

  function mover(passo) {
    const d = estado.data;
    if (estado.visao === 'dia') estado.data = somarDias(d, passo);
    else if (estado.visao === 'semana') estado.data = somarDias(d, passo * 7);
    else estado.data = new Date(d.getFullYear(), d.getMonth() + passo, 1);
    desenhar();
  }

  const botaoHoje = DS.botao({ variante: 'secundario', tamanho: 'pequeno', rotulo: 'Hoje' });
  botaoHoje.addEventListener('click', () => { estado.data = hoje; desenhar(); });
  const anterior = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'esquerda', rotulo: 'Período anterior' });
  anterior.addEventListener('click', () => mover(-1));
  const proximo = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'direita', rotulo: 'Próximo período' });
  proximo.addEventListener('click', () => mover(1));
  document.getElementById('agenda-navegar').append(botaoHoje, anterior, proximo);

  const gradeEl = document.getElementById('grade-agenda');
  function ajustarAltura() {
    document.documentElement.style.removeProperty('--grade-altura');
    const topo = gradeEl.getBoundingClientRect().top + window.scrollY;
    const sobra = window.innerHeight - topo - 32;
    document.documentElement.style.setProperty('--grade-altura', `${Math.max(320, Math.round(sobra))}px`);
  }
  window.addEventListener('resize', ajustarAltura);
  const detalhe = criarDetalhe();

  function desenhar() {
    abas.forEach((aba) => {
      const ativa = aba.dataset.visao === estado.visao;
      aba.setAttribute('aria-selected', String(ativa));
      aba.tabIndex = ativa ? 0 : -1;
    });
    grade.setAttribute('aria-labelledby', `visao-${estado.visao}`);
    grade.dataset.agendaData = iso(estado.data);
    grade.dataset.visaoAtual = estado.visao;
    document.getElementById('agenda-periodo').textContent = rotuloDoPeriodo(estado.visao, estado.data);
    const pecas = DESENHO[estado.visao](estado.data);
    const achados = (buscando() || filtrando()) && ATIVIDADES.length ? achadosNoPeriodo() : null;
    document.getElementById('agenda-contagem').textContent = achados === null ? '' : contagem(achados);
    document.getElementById('agenda-limpar').replaceChildren(...(filtrando() ? [botaoLimpar] : []));
    const avisos = !ATIVIDADES.length ? [avisoVazio()] : achados === 0 ? [avisoBusca()] : [];
    grade.replaceChildren(...avisos, ...pecas);
    ajustarAltura();
    detalhe.sincronizar();
  }

  document.getElementById('agenda-buscar').append(DS.busca({
    rotulo: 'Buscar na agenda',
    placeholder: 'Título, nº ou pessoa',
    largura: 'p',
    aoMudar: (valor) => { busca.termo = valor; desenhar(); prioridades(); },
  }));

  // --- filtros: pessoa e tipo ----------------------------------------------

  function montarFiltros() {
    const seletores = Object.entries(FILTROS).map(([chave, f]) => {
      const el = DS.seletor({
        rotulo: f.rotulo, opcoes: f.opcoes, valor: filtro[chave], largura: 'p',
        aoEscolher: (valor) => { filtro[chave] = valor; gravarFiltros(); desenhar(); prioridades(); },
      });
      el.dataset.filtro = chave;
      return el;
    });
    document.getElementById('agenda-filtros').replaceChildren(...seletores);
  }

  const botaoLimpar = DS.botao({ variante: 'texto', tamanho: 'pequeno', rotulo: 'Limpar filtros' });
  botaoLimpar.dataset.acao = 'limpar-filtros';
  botaoLimpar.addEventListener('click', () => {
    Object.assign(filtro, PADRAO);
    gravarFiltros();
    montarFiltros();
    desenhar();
    prioridades();
    document.querySelector('#agenda-filtros button').focus();
  });
  montarFiltros();

  // --- criar atividade -----------------------------------------------------

  // O botão abre o painel direto: um clique, uma camada (PA-27).
  const botaoCriar = DS.botao({ variante: 'primario', iconeEsquerda: 'mais', rotulo: 'Criar atividade' });
  botaoCriar.dataset.acao = 'criar-atividade';
  botaoCriar.setAttribute('data-abre-painel', '');
  botaoCriar.setAttribute('aria-haspopup', 'dialog');
  botaoCriar.addEventListener('click', () => DS.painelCriarAtividade({ tipo: 'tarefa' }).abrir(botaoCriar));
  document.getElementById('agenda-criar').append(botaoCriar);

  // A atividade salva entra na grade, e a grade vai ao dia dela: o resultado aparece junto da ação.
  const UM_DIA_MS = 24 * 60 * 60 * 1000;
  document.addEventListener('atividade-criada', ({ detail }) => {
    const [ano, mes, dia] = detail.data.split('-').map(Number);
    const data = new Date(ano, mes - 1, dia);
    ATIVIDADES.push(naAgenda({
      id: `nova-${ATIVIDADES.length + 1}`, titulo: detail.titulo, tipo: detail.tipo,
      processo: detail.processo, responsavel: detail.responsavel,
      prazoEmDias: Math.round((data - hoje) / UM_DIA_MS), status: detail.concluida ? 'concluido' : 'a-fazer',
    }));
    estado.data = data;
    desenhar();
    prioridades();
  });

  desenhar();
  prioridades();

  // Link do menu Adicionar aberto sem componentes.js na página de origem.
  const tipoDaUrl = parametros.get('criar');
  if (tipoDaUrl && TIPOS[tipoDaUrl]) DS.painelCriarAtividade({ tipo: tipoDaUrl }).abrir(botaoCriar);
})();
</script>
