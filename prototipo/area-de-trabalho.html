<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área de trabalho, Astrea: protótipo</title>
<link rel="stylesheet" href="astrea.css">
<script src="moldura.js"></script>
<script src="componentes.js"></script>
<script src="dados.js"></script>
<style>
  /* Topo da área: o seletor de lista fica onde o Astrea o põe hoje (03-tela, custo do reaprendizado). */
  .area-topo {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-3) var(--space-4);
    margin-bottom: var(--space-4);
  }
  /* PA-35 a PA-37: cada filtro tem rótulo fixo, e a escolha volta ao abrir a página. */
  .barra-filtros { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: flex-start; gap: var(--space-3); min-width: 0; }

  /* PA-39: estatísticas viram uma linha de leitura. Cada número leva à seção que ele conta. */
  .leitura {
    display: flex;
    flex-wrap: wrap;
    gap: var(--border-width);
    margin: 0 0 var(--space-5);
    padding: 0;
    overflow: hidden;
    list-style: none;
    background-color: var(--color-border-default);
    border: var(--border-width) solid var(--color-border-default);
    border-radius: var(--radius-card);
  }
  .leitura li { display: flex; flex: 1 1 calc(var(--size-column) / 2); min-width: 0; background-color: var(--color-bg-surface); }
  .leitura-item {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: var(--space-1);
    padding: var(--space-3) var(--space-4);
    color: var(--color-text-default);
    text-decoration: none;
  }
  a.leitura-item:hover { background-color: var(--color-bg-subtle); }
  a.leitura-item:hover .leitura-rotulo { color: var(--color-text-default); text-decoration: underline; }
  .leitura-numero {
    font-size: var(--font-size-title);
    font-weight: var(--font-weight-semibold);
    font-variant-numeric: tabular-nums;
    line-height: var(--font-leading-tight);
  }
  .leitura-rotulo { color: var(--color-text-muted); font-size: var(--font-size-label); line-height: var(--font-leading-tight); }
  .leitura .is-alerta .leitura-numero { color: var(--color-text-danger); }

  .area-aviso:empty { display: none; }
  .area-aviso { margin-bottom: var(--space-4); }

  /* PA-32: três seções em ordem fixa. O cabeçalho repete o tom do chip, e o texto diz o estado. */
  .secao { margin-bottom: var(--space-6); scroll-margin-top: calc(var(--component-header-height) + var(--space-3)); }
  .secao-cabeca {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--space-1) var(--space-2);
    padding: 0 var(--space-3) var(--space-2);
    border-bottom: var(--border-width) solid var(--color-border-strong);
  }
  .secao-cabeca h2 {
    margin: 0;
    font-size: var(--font-size-label);
    font-weight: var(--font-weight-semibold);
    letter-spacing: var(--font-tracking-caps);
    line-height: var(--font-leading-tight);
    text-transform: uppercase;
  }
  .secao[data-secao="atrasadas"] h2 { color: var(--color-text-danger); }
  .secao-nota { color: var(--color-text-muted); font-size: var(--font-size-label); }
  .secao .estado-vazio { padding: var(--space-4) var(--space-3); }

  /* Filtros e alternância na mesma linha: a barra do DS tem largura total, aqui ela divide a linha. */
  /* Uma linha só: os filtros encolhem entre p e m, e o lado direito nunca quebra. */
  .area-topo { flex-wrap: nowrap; }
  .area-topo .barra-filtros { flex: 1 1 auto; flex-wrap: nowrap; width: auto; }
  .area-topo .barra-filtros .campo { flex: 1 1 0; width: auto; min-width: var(--component-field-width-p); max-width: var(--component-field-width-m); }
  .area-direita { display: flex; flex: 0 0 auto; flex-wrap: nowrap; align-items: center; gap: var(--space-3); margin-left: auto; min-height: var(--component-control-height); }
  @media (max-width: 1100px) {
    .area-topo, .area-topo .barra-filtros, .area-direita { flex-wrap: wrap; }
    .area-topo .barra-filtros .campo { max-width: none; }
  }
  /* Alternância de formato, a mesma de Contatos. */
  .formato {
    display: inline-flex;
    gap: var(--border-width);
    padding: var(--border-width);
    background-color: var(--color-bg-subtle);
    border: var(--border-width) solid var(--color-border-default);
    border-radius: var(--radius);
  }
  .formato-opcao {
    min-height: calc(var(--component-control-height) - var(--space-1));
    padding: 0 var(--space-3);
    background: none;
    border: var(--border-width) solid transparent;
    border-radius: var(--radius);
    color: var(--color-text-default);
    font: inherit;
    font-size: var(--font-size-button);
    cursor: pointer;
  }
  .formato-opcao:hover { background-color: var(--color-bg-hover); }
  .formato-opcao[aria-checked="true"] {
    background-color: var(--color-bg-surface);
    border-color: var(--color-border-strong);
    font-weight: var(--font-weight-semibold);
  }

  /* Cards: cada grupo é um container. Atrasadas ocupa a largura toda e fica acima de Hoje (PA-32). */
  [data-area-principal]:is([data-visao="cards"], [data-visao="kanban"]) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: start; gap: var(--space-4); margin-bottom: var(--space-6); }
  :is([data-visao="cards"], [data-visao="kanban"]) .secao { margin: 0; padding: var(--space-4); background-color: var(--color-bg-subtle); border-radius: var(--radius-card); }
  :is([data-visao="cards"], [data-visao="kanban"]) .secao[data-secao="atrasadas"], :is([data-visao="cards"], [data-visao="kanban"]) .secao[data-secao="concluidas"] { grid-column: 1 / -1; }
  :is([data-visao="cards"], [data-visao="kanban"]) .secao[data-secao="atrasadas"] { background-color: var(--color-bg-danger); }
  :is([data-visao="cards"], [data-visao="kanban"]) .secao[data-secao="atrasadas"] h2, :is([data-visao="cards"], [data-visao="kanban"]) .secao-nota { color: var(--color-text-default); }
  :is([data-visao="cards"], [data-visao="kanban"]) .secao-cabeca { padding: 0 0 var(--space-3); border-bottom: 0; }
  .cards-atividade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--size-column)), 1fr)); gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  /* Kanban: as mesmas seções, lado a lado como colunas (pedido de Felipe, 08/11). */
  [data-area-principal][data-visao="kanban"] { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); align-items: stretch; }
  [data-visao="kanban"] .secao[data-secao="atrasadas"], [data-visao="kanban"] .secao[data-secao="concluidas"] { grid-column: auto; }
  [data-visao="kanban"] .secao { min-height: 60vh; }
  [data-visao="kanban"] .cards-atividade { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 1100px) { [data-area-principal][data-visao="kanban"] { grid-template-columns: minmax(0, 1fr); } [data-visao="kanban"] .secao { min-height: 0; } }
  .cards-atividade > li { display: flex; min-width: 0; }
  .cards-atividade .card-atividade { width: 100%; }
  .card-acoes { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: auto; padding-top: var(--space-1); }
  @media (max-width: 900px) {
    [data-area-principal]:is([data-visao="cards"], [data-visao="kanban"]) { grid-template-columns: minmax(0, 1fr); }
  }

  /* Detalhe ao lado da lista (pedido de Felipe, 08/11): a linha e o card escolhem a atividade. */
  .linha-atividade[data-selecionavel], .card-atividade[data-selecionavel] { cursor: pointer; }
  .linha-atividade[data-selecionavel]:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: calc(-1 * var(--focus-width)); }
  .linha-atividade.is-selecionado { background-color: var(--color-bg-subtle); box-shadow: inset calc(var(--focus-width) + var(--border-width)) 0 0 var(--color-action); }
  .painel-detalhe-rodape a.botao { text-decoration: none; }
  .detalhe-processo { display: inline-flex; align-items: center; gap: var(--space-1); }
</style>
</head>
<body data-pagina="area-de-trabalho.html" data-titulo="Área de trabalho">
<div class="corpo">
  <main id="conteudo">
    <div class="area-topo">
      <div class="barra-filtros" id="filtros" role="group" aria-label="Filtros da área de trabalho"></div>
      <div class="area-direita">
        <div class="formato" id="formato" role="radiogroup" aria-label="Formato da lista"></div>
        <button type="button" id="criar-atividade" class="botao botao-primario" data-acao="criar-atividade" data-abre-painel aria-haspopup="dialog">Adicionar atividade</button>
      </div>
    </div>

    <ul class="leitura" id="leitura" aria-label="Resumo das atividades"></ul>

    <div class="area-aviso" id="area-aviso"></div>

    <div data-area-principal>
      <section class="secao" id="secao-atrasadas" data-secao="atrasadas" aria-labelledby="titulo-atrasadas">
        <div class="secao-cabeca"><h2 id="titulo-atrasadas">Atrasadas</h2><span class="secao-nota"></span></div>
        <div class="secao-corpo"></div>
      </section>
      <section class="secao" id="secao-hoje" data-secao="hoje" aria-labelledby="titulo-hoje">
        <div class="secao-cabeca"><h2 id="titulo-hoje">Hoje</h2><span class="secao-nota"></span></div>
        <div class="secao-corpo"></div>
      </section>
      <section class="secao" id="secao-proximos" data-secao="proximos" aria-labelledby="titulo-proximos">
        <div class="secao-cabeca"><h2 id="titulo-proximos">Próximos</h2><span class="secao-nota"></span></div>
        <div class="secao-corpo"></div>
      </section>
      <section class="secao" id="secao-concluidas" data-secao="concluidas" aria-labelledby="titulo-concluidas" hidden>
        <div class="secao-cabeca"><h2 id="titulo-concluidas">Concluídas</h2><span class="secao-nota"></span></div>
        <div class="secao-corpo"></div>
      </section>
    </div>
  </main>
</div>

<script>
(function () {
  // PA-37: a escolha dos filtros fica gravada no navegador e volta ao abrir a página.
  const CHAVE_FILTRO = 'astrea-filtro-area';
  // Cards abre por padrão: cada grupo vira um container, com as ações à vista.
  const CHAVE_VISAO = 'astrea-area-visao';
  const VISOES = [['cards', 'Cards'], ['lista', 'Lista'], ['kanban', 'Kanban']];
  // O usuário logado da moldura. Minhas e Delegadas comparam o responsável com ele (PA-35).
  const EU = 'Marina Couto';
  const OUTRAS_PESSOAS = window.DADOS.RESPONSAVEIS.filter((nome) => nome !== EU).sort();

  // Cada filtro: opções [chave, rótulo] e o teste da atividade. A primeira opção é o padrão.
  // PA-31: a tela abre em todas as listas. A lista guarda tarefa e prazo; audiência e
  // evento vêm da Agenda e entram em "Todas as listas" (PA-53).
  // O período nunca esconde o atrasado: "até" conta do passado até o limite (P1).
  const FILTROS = {
    lista: {
      rotulo: 'Lista',
      opcoes: [['todas', 'Todas as listas'], ['tarefas', 'Lista de tarefas']],
      aceita: (valor, a) => valor === 'todas' || ['tarefa', 'prazo'].includes(a.tipo),
    },
    responsavel: {
      rotulo: 'Responsável',
      opcoes: [['todos', 'Todas as pessoas'], ['minhas', 'Minhas'], ['delegadas', 'Delegadas'],
        ...OUTRAS_PESSOAS.map((nome) => [nome, nome])],
      aceita: (valor, a) => ({ todos: true, minhas: a.responsavel === EU, delegadas: a.responsavel !== EU })[valor]
        ?? a.responsavel === valor,
    },
    periodo: {
      rotulo: 'Período',
      opcoes: [['todos', 'Qualquer prazo'], ['hoje', 'Até hoje'], ['7', 'Até 7 dias'], ['30', 'Até 30 dias']],
      aceita: (valor, a) => valor === 'todos' || a.prazoEmDias <= (valor === 'hoje' ? 0 : Number(valor)),
    },
    situacao: {
      rotulo: 'Situação',
      opcoes: [['abertas', 'Abertas'], ['concluidas', 'Concluídas'], ['todas', 'Abertas e concluídas']],
    },
  };
  const PADRAO = Object.fromEntries(Object.entries(FILTROS).map(([chave, f]) => [chave, f.opcoes[0][0]]));

  const concluida = (a) => a.status === 'concluido';
  // PA-32: três seções em ordem fixa para o que está aberto. A concluída tem seção própria (PA-36).
  const SECOES = [
    { chave: 'atrasadas', pertence: (a) => !concluida(a) && a.prazoEmDias < 0, vazio: 'Nenhuma atividade atrasada.' },
    { chave: 'hoje', pertence: (a) => !concluida(a) && a.prazoEmDias === 0, vazio: 'Nada vence hoje.' },
    { chave: 'proximos', pertence: (a) => !concluida(a) && a.prazoEmDias > 0, vazio: 'Nenhuma atividade nos próximos dias.' },
    { chave: 'concluidas', pertence: concluida, vazio: 'Nenhuma atividade concluída.' },
  ];
  const SECOES_DA_SITUACAO = {
    abertas: ['atrasadas', 'hoje', 'proximos'],
    concluidas: ['concluidas'],
    todas: ['atrasadas', 'hoje', 'proximos', 'concluidas'],
  };

  const atividades = window.DADOS.ATIVIDADES.map((a) => ({ ...a }));
  const filtro = lerFiltro();
  let visao = lerVisao();

  function lerVisao() {
    let salva = null;
    try { salva = localStorage.getItem(CHAVE_VISAO); } catch (e) { salva = null; }
    return VISOES.some(([chave]) => chave === salva) ? salva : VISOES[0][0];
  }

  // Valor gravado fora das opções volta ao padrão: a opção pode ter saído da conta.
  function lerFiltro() {
    let salvo = {};
    try { salvo = JSON.parse(localStorage.getItem(CHAVE_FILTRO)) || {}; } catch (e) { salvo = {}; }
    return Object.fromEntries(Object.entries(FILTROS).map(([chave, f]) => {
      const valido = f.opcoes.some(([opcao]) => opcao === salvo[chave]);
      return [chave, valido ? salvo[chave] : PADRAO[chave]];
    }));
  }

  function gravarFiltro() {
    try { localStorage.setItem(CHAVE_FILTRO, JSON.stringify(filtro)); } catch (e) { /* sem armazenamento */ }
  }

  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const filtrado = () => Object.keys(FILTROS).some((chave) => filtro[chave] !== PADRAO[chave]);
  // A situação escolhe as seções; os outros filtros escolhem as linhas.
  const passa = (a) => ['lista', 'responsavel', 'periodo'].every((chave) => FILTROS[chave].aceita(filtro[chave], a));

  // --- ações da linha: o resultado fica na própria tela, com desfazer -----------

  function avisar(mensagem, desfazer) {
    const vaga = document.getElementById('area-aviso');
    const faixa = DS.faixaAviso({
      tipo: 'sucesso', mensagem, fechar: true,
      acao: { rotulo: 'Desfazer', aoClicar: () => { vaga.replaceChildren(); desfazer(); } },
    });
    vaga.replaceChildren(faixa);
    faixa.querySelector('button').focus();
  }

  function alterar(atividade, mudanca, mensagem) {
    const antes = { status: atividade.status, prazoEmDias: atividade.prazoEmDias };
    Object.assign(atividade, mudanca);
    desenhar();
    avisar(mensagem, () => {
      Object.assign(atividade, antes);
      desenhar();
      const linha = document.querySelector(`[data-id="${atividade.id}"] .linha-acoes button, [data-id="${atividade.id}"] .card-acoes button`);
      if (linha) linha.focus();
    });
  }

  function acoesDe(atividade) {
    if (concluida(atividade)) {
      return [{ rotulo: 'Reabrir', icone: 'editar',
        aoClicar: () => alterar(atividade, { status: 'a-fazer' }, `"${atividade.titulo}" reaberta.`) }];
    }
    return [
      { rotulo: 'Concluir', icone: 'marca',
        aoClicar: () => alterar(atividade, { status: 'concluido' }, `"${atividade.titulo}" concluída.`) },
      { rotulo: 'Adiar 1 dia', icone: 'calendario',
        aoClicar: () => alterar(atividade, { prazoEmDias: atividade.prazoEmDias + 1 },
          `"${atividade.titulo}" adiada: agora ${DS.descreverPrazo(atividade.prazoEmDias + 1).rotulo.toLowerCase()}.`) },
    ];
  }

  // --- filtros -----------------------------------------------------------------

  function limparFiltros() {
    Object.assign(filtro, PADRAO);
    gravarFiltro();
    montarFiltros();
    desenhar();
    document.querySelector('#filtros button').focus();
  }

  function montarFiltros() {
    const seletores = Object.entries(FILTROS).map(([chave, f]) => {
      const el = DS.seletor({
        rotulo: f.rotulo, opcoes: f.opcoes, valor: filtro[chave], largura: 'p',
        aoEscolher: (valor) => { filtro[chave] = valor; gravarFiltro(); desenhar(); },
      });
      el.dataset.filtro = chave;
      return el;
    });
    document.getElementById('filtros').replaceChildren(...seletores);
  }

  // --- formato: cards ou lista --------------------------------------------------

  function montarFormato() {
    const grupo = document.getElementById('formato');
    const opcoes = VISOES.map(([chave, rotulo]) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'formato-opcao';
      el.textContent = rotulo;
      el.dataset.visao = chave;
      el.setAttribute('role', 'radio');
      el.addEventListener('click', () => escolher(chave, false));
      return el;
    });
    function marcar() {
      opcoes.forEach((el) => {
        const marcada = el.dataset.visao === visao;
        el.setAttribute('aria-checked', String(marcada));
        el.tabIndex = marcada ? 0 : -1;
      });
    }
    function escolher(chave, focar) {
      visao = chave;
      try { localStorage.setItem(CHAVE_VISAO, chave); } catch (e) { /* sem armazenamento */ }
      marcar();
      desenhar();
      if (focar) opcoes.find((el) => el.dataset.visao === chave).focus();
    }
    grupo.addEventListener('keydown', (e) => {
      const passo = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!passo) return;
      e.preventDefault();
      const atual = VISOES.findIndex(([chave]) => chave === visao);
      escolher(VISOES[(atual + passo + VISOES.length) % VISOES.length][0], true);
    });
    grupo.replaceChildren(...opcoes);
    marcar();
  }

  // --- detalhe ao lado da lista (padrão do Cotação e da náutica; Contatos é o primeiro) ---

  const CHAVE_DETALHE = 'astrea-area-detalhe-id';
  const CHAVE_LARGURA = 'astrea-area-detalhe-largura';
  const LISTA_MINIMA = 480;
  const NOME_DO_TIPO = { tarefa: 'Tarefa', prazo: 'Prazo', audiencia: 'Audiência', evento: 'Evento' };
  const NOME_DA_LISTA = { tarefa: 'Lista de tarefas', prazo: 'Lista de tarefas', audiencia: 'Agenda', evento: 'Agenda' };

  function lerDetalhe() {
    try { return localStorage.getItem(CHAVE_DETALHE); } catch (e) { return null; }
  }

  function gravarDetalhe(id) {
    try { localStorage.setItem(CHAVE_DETALHE, id); } catch (e) { /* sem armazenamento */ }
  }

  // A ordem do ‹ › é a da tela: seções visíveis, cada uma pelo prazo.
  function itensVisiveis(lista, visiveis) {
    return SECOES.filter((s) => visiveis.includes(s.chave))
      .flatMap((s) => lista.filter(s.pertence).sort((x, y) => x.prazoEmDias - y.prazoEmDias));
  }

  // O mesmo botão de copiar da linha: o verificador lê data-acao="copiar-numero".
  function copiarNumero(numero) {
    const el = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'copiar', rotulo: 'Copiar número' });
    el.dataset.acao = 'copiar-numero';
    const envolto = DS.tooltip({ alvo: el, rotulo: 'Copiar número' });
    const dica = envolto.querySelector('.dica');
    el.addEventListener('click', () => {
      const area = navigator.clipboard;
      const avisar = (texto) => { if (dica) dica.textContent = texto; };
      if (!area) { avisar('Não foi possível copiar'); return; }
      area.writeText(numero).then(() => avisar('Número copiado'), () => avisar('Não foi possível copiar'));
    });
    return envolto;
  }

  function valorDoProcesso(numero) {
    if (!numero) return '';
    const el = document.createElement('span');
    el.className = 'detalhe-processo';
    const texto = document.createElement('span');
    texto.className = 'numero-processo';
    texto.textContent = numero;
    el.append(texto, copiarNumero(numero));
    return el;
  }

  function urlDoProcesso(numero) {
    const i = (window.DADOS.PROCESSOS || []).findIndex((p) => p.numero === numero);
    return `processos.html?ficha=${i + 1 || 1}`;
  }

  function dadosDoDetalhe(a, itens) {
    const prazo = DS.descreverPrazo(a.prazoEmDias, concluida(a));
    const linhas = [
      { icone: 'arquivar', rotulo: 'Processo', valor: valorDoProcesso(a.processo) },
      { icone: 'pessoa', rotulo: 'Responsável', valor: a.responsavel ? DS.avatar({ nome: a.responsavel, mostrarNome: true }) : '' },
      { icone: 'calendario', rotulo: 'Lista', valor: NOME_DA_LISTA[a.tipo] },
      { icone: 'marca', rotulo: 'Situação', valor: concluida(a) ? 'Concluída' : 'Aberta' },
    ];
    if (a.prioridade) linhas.push({ icone: 'alerta', rotulo: 'Prioridade', valor: a.prioridade });
    const acoes = acoesDe(a).map((acao) => ({ rotulo: acao.rotulo, iconeEsquerda: acao.icone, aoClicar: acao.aoClicar }));
    const abrir = document.createElement('a');
    abrir.className = 'botao botao-primario';
    abrir.href = urlDoProcesso(a.processo);
    abrir.textContent = 'Abrir processo';
    return {
      titulo: a.titulo,
      chips: [DS.chipPrazo(prazo), DS.tag({ rotulo: NOME_DO_TIPO[a.tipo] })],
      destaque: { rotulo: 'Prazo', valor: prazo.rotulo },
      linhas, corpo: [], acoes: [...acoes, abrir], navegavel: itens.length > 1,
    };
  }

  // Sem escolha gravada, o painel fica escondido e aparece no primeiro clique.
  // Se o filtro ou a conclusão tira a escolhida, o painel passa à que ocupou o lugar dela.
  function criarDetalhe() {
    let escolhido = lerDetalhe();
    let itens = [];
    let posicao = 0;
    const atual = () => itens.find((a) => a.id === escolhido);
    function andar(passo) {
      const i = Math.max(0, itens.indexOf(atual()));
      escolher(itens[(i + passo + itens.length) % itens.length].id);
    }
    const painel = DS.painelDetalhe({
      rotulo: 'Atividade escolhida',
      rotulos: { anterior: 'Atividade anterior da lista', proximo: 'Próxima atividade da lista',
        esconder: 'Esconder o painel da atividade', mostrar: 'Mostrar o painel da atividade' },
      aoAnterior: () => andar(-1),
      aoProximo: () => andar(1),
      aoFechar: () => { divisor.el.hidden = true; },
      aoReabrir: () => { divisor.el.hidden = false; },
    });
    painel.el.id = 'area-detalhe';
    const divisor = DS.divisorRedimensionavel({
      alvo: painel.el, rotulo: 'Largura do painel da atividade', minimo: 300, maximo: 560, padrao: 380,
      chave: CHAVE_LARGURA, reserva: LISTA_MINIMA,
    });
    const principal = document.querySelector('[data-area-principal]');
    const casca = document.createElement('div');
    casca.className = 'lista-e-detalhe';
    principal.before(casca);
    casca.append(principal, divisor.el, painel.el);

    function marcar(id) {
      principal.querySelectorAll('[data-selecionavel]').forEach((el) => {
        const sim = el.dataset.id === id;
        el.classList.toggle('is-selecionado', sim);
        el.setAttribute('aria-current', String(sim));
      });
    }

    function sincronizar(novos) {
      itens = novos;
      let a = atual();
      if (!a && escolhido && itens.length) {
        a = itens[Math.min(posicao, itens.length - 1)];
        escolhido = a.id;
        gravarDetalhe(escolhido);
      }
      if (a) posicao = itens.indexOf(a);
      painel.el.hidden = !a;
      divisor.el.hidden = !a || painel.oculto();
      marcar(a ? a.id : '');
      if (a) painel.mostrar(dadosDoDetalhe(a, itens));
    }

    function escolher(id) {
      if (!itens.some((a) => a.id === id)) return;
      escolhido = id;
      gravarDetalhe(id);
      if (painel.oculto()) painel.reabrir();
      sincronizar(itens);
    }

    return { escolher, sincronizar };
  }

  // Clique e Enter escolhem; o copiar e os botões de ação da linha seguem sozinhos.
  function selecionavel(el, a) {
    el.dataset.selecionavel = '';
    el.addEventListener('click', (e) => { if (!e.target.closest('button, a')) detalhe.escolher(a.id); });
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.target !== el) return;
      e.preventDefault();
      detalhe.escolher(a.id);
    });
  }

  const detalhe = criarDetalhe();

  // --- desenho -----------------------------------------------------------------

  function linha(a) {
    const prazo = DS.descreverPrazo(a.prazoEmDias, concluida(a));
    const el = DS.linhaAtividade({
      titulo: a.titulo, tipo: a.tipo, estadoPrazo: prazo.estadoPrazo, prazo: prazo.rotulo,
      processo: a.processo, responsavel: a.responsavel, acoes: acoesDe(a),
    });
    el.dataset.id = a.id;
    el.tabIndex = 0;
    selecionavel(el, a);
    return el;
  }

  function card(a) {
    const prazo = DS.descreverPrazo(a.prazoEmDias, concluida(a));
    const el = DS.cardAtividade({
      titulo: a.titulo, tipo: a.tipo, estadoPrazo: prazo.estadoPrazo, prazo: prazo.rotulo,
      processo: a.processo, responsavel: a.responsavel, copiarNumero: true,
    });
    el.dataset.id = a.id;
    const acoes = document.createElement('div');
    acoes.className = 'card-acoes';
    acoes.append(...acoesDe(a).map((acao, i) => {
      const botao = DS.botao({ rotulo: acao.rotulo, iconeEsquerda: acao.icone, tamanho: 'pequeno', variante: i === 0 ? 'secundario' : 'texto' });
      botao.addEventListener('click', acao.aoClicar);
      return botao;
    }));
    el.append(acoes);
    if (visao === 'cards') selecionavel(el, a);
    const li = document.createElement('li');
    li.append(el);
    return li;
  }

  // Vazio por filtro troca a ação: "Limpar filtros" (03-tela, estado vazio).
  function vazio(secao) {
    if (!filtrado()) return DS.estadoVazio({ titulo: secao.vazio });
    return DS.estadoVazio({
      titulo: secao.vazio, texto: 'Os filtros escondem o que houver aqui.',
      acao: { rotulo: 'Limpar filtros', variante: 'secundario', aoClicar: limparFiltros },
    });
  }

  function desenharSecao(secao, lista, visivel) {
    const raiz = document.querySelector(`[data-secao="${secao.chave}"]`);
    const daqui = lista.filter(secao.pertence).sort((x, y) => x.prazoEmDias - y.prazoEmDias);
    raiz.hidden = !visivel;
    raiz.querySelector('.secao-nota').textContent = plural(daqui.length, 'atividade', 'atividades');
    const corpo = raiz.querySelector('.secao-corpo');
    if (!daqui.length) {
      corpo.replaceChildren(vazio(secao));
      return daqui.length;
    }
    const ul = document.createElement('ul');
    ul.className = visao === 'lista' ? 'lista-atividades' : 'cards-atividade';
    ul.setAttribute('aria-labelledby', `titulo-${secao.chave}`);
    ul.append(...daqui.map(visao === 'lista' ? linha : card));
    corpo.replaceChildren(ul);
    return daqui.length;
  }

  function itemDeLeitura(numero, rotulo, destino, alerta) {
    const li = document.createElement('li');
    const el = document.createElement(destino ? 'a' : 'span');
    el.className = 'leitura-item' + (alerta ? ' is-alerta' : '');
    if (destino) el.href = destino;
    const n = document.createElement('span');
    n.className = 'leitura-numero';
    n.textContent = numero;
    const r = document.createElement('span');
    r.className = 'leitura-rotulo';
    r.textContent = rotulo;
    el.append(n, r);
    li.append(el);
    return li;
  }

  // A leitura segue os filtros de linha. O número só vira link quando a seção dele está na tela.
  function desenharLeitura(contagem, lista, visiveis) {
    const destino = (chave) => (visiveis.includes(chave) ? `#secao-${chave}` : null);
    const processos = new Set(lista.filter((a) => !concluida(a)).map((a) => a.processo)).size;
    document.getElementById('leitura').replaceChildren(
      itemDeLeitura(contagem.atrasadas, contagem.atrasadas === 1 ? 'atrasada' : 'atrasadas', destino('atrasadas'), contagem.atrasadas > 0),
      itemDeLeitura(contagem.hoje, contagem.hoje === 1 ? 'vence hoje' : 'vencem hoje', destino('hoje')),
      itemDeLeitura(contagem.proximos, 'nos próximos dias', destino('proximos')),
      itemDeLeitura(processos, processos === 1 ? 'processo com atividade aberta' : 'processos com atividade aberta'),
      itemDeLeitura(contagem.concluidas, contagem.concluidas === 1 ? 'concluída' : 'concluídas', destino('concluidas')),
    );
  }

  function desenhar() {
    document.querySelector('[data-area-principal]').dataset.visao = visao;
    const lista = atividades.filter(passa);
    const visiveis = SECOES_DA_SITUACAO[filtro.situacao];
    const contagem = {};
    SECOES.forEach((secao) => { contagem[secao.chave] = desenharSecao(secao, lista, visiveis.includes(secao.chave)); });
    desenharLeitura(contagem, lista, visiveis);
    detalhe.sincronizar(visao === 'kanban' ? [] : itensVisiveis(lista, visiveis));
  }


  // Criar atividade na própria tela: o botão primário abre o painel único (PA-24, Task 13),
  // e a atividade salva entra na seção do prazo dela. O resultado aparece junto da ação.
  const botaoCriar = document.getElementById('criar-atividade');
  botaoCriar.addEventListener('click', () => DS.painelCriarAtividade({ tipo: 'tarefa' }).abrir(botaoCriar));
  const UM_DIA_MS = 24 * 60 * 60 * 1000;
  document.addEventListener('atividade-criada', ({ detail }) => {
    const [ano, mes, dia] = detail.data.split('-').map(Number);
    const agora = new Date();
    const meiaNoite = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
    const prazoEmDias = Math.round((new Date(ano, mes - 1, dia) - meiaNoite) / UM_DIA_MS);
    atividades.push({
      id: `nova-${atividades.length + 1}`, titulo: detail.titulo, tipo: detail.tipo,
      processo: detail.processo || '', responsavel: detail.responsavel || EU,
      prazoEmDias, status: detail.concluida ? 'concluido' : 'a-fazer',
    });
    desenhar();
  });
  montarFiltros();
  montarFormato();
  desenhar();
})();
</script>
