<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alertas, Astrea: protótipo</title>
<link rel="stylesheet" href="astrea.css">
<script src="moldura.js"></script>
<script src="componentes.js"></script>
<script src="dados.js"></script>
<style>
  .alertas-aviso:empty { display: none; }
  .alertas-aviso { margin-bottom: var(--space-4); }

  /* PA-81: uma barra só, entre as abas e o painel, igual em todas as abas. */
  .alertas .barra-filtros { padding-bottom: var(--space-3); border-bottom: var(--border-width) solid var(--color-border-default); }

  .lista-alertas { display: grid; gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  .alerta {
    display: grid;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    background-color: var(--component-card-bg);
    border: var(--border-width) solid var(--color-border-default);
    border-radius: var(--radius-card);
  }
  .alerta-topo { display: flex; align-items: flex-start; gap: var(--space-3); min-width: 0; }
  .alerta-texto { display: grid; flex: 1; gap: var(--space-1); min-width: 0; }
  .alerta-motivo {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
    margin: 0;
    color: var(--color-text-muted);
    font-size: var(--font-size-label);
  }
  .alerta-titulo {
    margin: 0;
    font-size: var(--font-size-emphasis);
    font-weight: var(--font-weight-medium);
    line-height: var(--font-leading-tight);
    overflow-wrap: anywhere;
  }
  .alerta-expandir .icone { transition: transform 120ms ease; }
  .alerta-expandir[aria-expanded="true"] .icone { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .alerta-expandir .icone { transition: none; } }

  .detalhes {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    align-items: center;
    gap: var(--space-2) var(--space-4);
    margin: 0;
  }
  .detalhes dt { color: var(--color-text-muted); font-size: var(--font-size-label); }
  .detalhes dd { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); min-width: 0; margin: 0; }
  .alerta .grupo-botoes { flex-wrap: wrap; }

  /* Lista à esquerda, detalhe ao lado: o card escolhido ganha a borda de ação. */
  .alerta[data-id] { cursor: pointer; }
  .alerta[data-id]:hover { background-color: var(--color-bg-subtle); }
  .alerta[data-id]:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: calc(-1 * var(--focus-width)); }
  .alerta.is-selecionado { border-color: var(--color-action); box-shadow: inset 0 0 0 var(--border-width) var(--color-action); }
  .alerta-numero { display: inline-flex; align-items: center; gap: var(--space-1); }
</style>
</head>
<body data-pagina="alertas.html" data-titulo="Alertas">
<div class="corpo">
  <main id="conteudo">
    <div class="alertas-aviso" id="alertas-aviso"></div>
    <div class="alertas" id="alertas"></div>
  </main>
</div>

<script>
(function () {
  // As nove abas na ordem do Astrea (varredura, seção 5). "Todos" reúne as outras.
  const ABAS = [
    ['importantes', 'Importantes'], ['todos', 'Todos'], ['andamentos', 'Andamentos'],
    ['processos', 'Processos'], ['tarefas', 'Tarefas'], ['agenda', 'Agenda'],
    ['portal', 'Portal do Cliente'], ['integracao', 'Integração'], ['outros', 'Outros'],
  ];
  // PA-80: uma frase de vazio para todas as abas.
  const VAZIO = 'Nenhum alerta nesta aba.';
  const TIPO = { tarefa: 'Tarefa', prazo: 'Prazo' };
  const MOTIVO = { tarefa: 'Tarefa atrasada', prazo: 'Prazo atrasado' };
  const ORDENS = [['recentes', 'Mais recentes primeiro'], ['antigos', 'Mais antigos primeiro']];
  const REAGENDAR = [[1, 'Para amanhã'], [2, 'Para daqui a 2 dias'], [7, 'Para daqui a 7 dias']];

  // O alerta nasce da atividade aberta e vencida. Tarefa e prazo moram na aba Tarefas.
  const atividades = window.DADOS.ATIVIDADES.map((a) => ({ ...a }));
  const descartados = new Set();
  const expandidos = new Set();
  let ordem = 'recentes';
  let abaAtual = 'todos';

  const emAlerta = (a) => window.DADOS.emAlerta(a) && !descartados.has(a.id);
  const daAba = (aba) => (a) => aba === 'todos' || (aba === 'tarefas' && ['tarefa', 'prazo'].includes(a.tipo));
  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

  function alertasDa(aba) {
    const lista = atividades.filter(emAlerta).filter(daAba(aba));
    // Mais recente: o que venceu há menos dias.
    return lista.sort((x, y) => (ordem === 'recentes' ? y.prazoEmDias - x.prazoEmDias : x.prazoEmDias - y.prazoEmDias));
  }

  // --- ações -------------------------------------------------------------------

  function focarPainel() {
    const painel = document.querySelector('#alertas [role="tabpanel"]:not([hidden])');
    if (painel) painel.focus();
  }

  function avisar(mensagem, desfazer) {
    const vaga = document.getElementById('alertas-aviso');
    const faixa = DS.faixaAviso({
      tipo: 'sucesso', mensagem, fechar: true,
      acao: { rotulo: 'Desfazer', aoClicar: () => { vaga.replaceChildren(); desfazer(); focarPainel(); } },
    });
    vaga.replaceChildren(faixa);
    faixa.querySelector('button').focus();
  }

  function alterar(atividade, mudanca, mensagem) {
    const antes = { status: atividade.status, prazoEmDias: atividade.prazoEmDias };
    Object.assign(atividade, mudanca);
    desenhar();
    avisar(mensagem, () => { Object.assign(atividade, antes); desenhar(); });
  }

  // PA-78: o botão e o diálogo usam o mesmo verbo. PA-79: o texto diz só o efeito.
  function confirmarDescarte(atividade, origem) {
    let descartou = false;
    const dialogo = DS.dialogo({
      titulo: 'Descartar alerta?',
      texto: `O alerta de "${atividade.titulo}" sai da lista. A atividade continua na Área de trabalho.`,
      acoes: [
        { rotulo: 'Cancelar', variante: 'secundario' },
        { rotulo: 'Descartar', variante: 'destrutivo', aoClicar: () => { descartou = true; } },
      ],
      aoFechar: () => {
        dialogo.el.remove();
        if (!descartou) return;
        descartados.add(atividade.id);
        desenhar();
        focarPainel();
      },
    });
    dialogo.abrir(origem);
  }

  let painel = null;

  // --- detalhe ao lado da lista (o mesmo arranjo de contatos.html) ------------

  function detalheAoLado(cfg) {
    const { pagina, lista, rotulo, rotulos, dadosDe, aoEstreita } = cfg;
    const chave = (s) => `astrea-${pagina}-detalhe-${s}`;
    const ler = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } };
    const estreita = window.matchMedia('(max-width: 1100px)');
    let escolhido = ler(chave('id'));
    let itens = [];
    const atual = () => itens.find((x) => x.id === escolhido) || itens[0];
    const andar = (passo) => {
      const i = itens.indexOf(atual());
      escolher(itens[(i + passo + itens.length) % itens.length].id);
    };
    const detalhe = DS.painelDetalhe({
      rotulo, rotulos,
      aoAnterior: () => andar(-1),
      aoProximo: () => andar(1),
      aoFechar: () => { gravar(chave('oculto'), '1'); divisor.el.hidden = true; },
      aoReabrir: () => { gravar(chave('oculto'), ''); divisor.el.hidden = false; },
    });
    detalhe.el.id = `${pagina}-detalhe`;
    const divisor = DS.divisorRedimensionavel({
      alvo: detalhe.el, rotulo: 'Largura do painel de detalhe', minimo: 300, maximo: 560, padrao: 380,
      chave: chave('largura'), reserva: 480,
    });
    const casca = document.createElement('div');
    casca.className = 'lista-e-detalhe';
    casca.append(lista, divisor.el, detalhe.el);
    if (ler(chave('oculto')) === '1') { detalhe.esconder(); divisor.el.hidden = true; }

    function marcar(id) {
      lista.querySelectorAll('[data-id]').forEach((el) => {
        const sim = el.dataset.id === id;
        if (el.tagName === 'TR') { el.setAttribute('aria-selected', String(sim)); return; }
        el.classList.toggle('is-selecionado', sim);
        if (sim) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
      });
    }
    function sincronizar(novos) {
      itens = novos;
      const x = atual();
      detalhe.el.hidden = !x;
      divisor.el.hidden = !x || detalhe.oculto();
      marcar(x ? x.id : '');
      if (x) detalhe.mostrar({ ...dadosDe(x), navegavel: itens.length > 1 });
    }
    function escolher(id) {
      const x = itens.find((i) => i.id === id);
      if (!x) return;
      if (estreita.matches) { if (aoEstreita) aoEstreita(x); return; }
      escolhido = id;
      gravar(chave('id'), id);
      if (detalhe.oculto()) { detalhe.reabrir(); divisor.el.hidden = false; gravar(chave('oculto'), ''); }
      sincronizar(itens);
    }
    // O botão e o link de dentro do item seguem a própria ação; o resto do item escolhe.
    lista.addEventListener('click', (e) => {
      const alvo = e.target.closest('[data-id]');
      if (alvo && lista.contains(alvo) && !e.target.closest('a, button, [role="menu"]')) escolher(alvo.dataset.id);
    });
    lista.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.matches('[data-id]')) { e.preventDefault(); escolher(e.target.dataset.id); }
    });
    return { casca, sincronizar };
  }

  function dataDoAlerta(dias) {
    const d = new Date();
    d.setDate(d.getDate() + dias);
    return d.toLocaleDateString('pt-BR');
  }

  function numeroComCopiar(numero) {
    const caixa = document.createElement('span');
    caixa.className = 'alerta-numero';
    const texto = document.createElement('span');
    texto.className = 'numero-processo';
    texto.textContent = numero;
    const copiar = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'copiar', rotulo: 'Copiar número' });
    copiar.addEventListener('click', () => {
      const vaga = document.getElementById('alertas-aviso');
      const dizer = (mensagem, tipo) => vaga.replaceChildren(DS.faixaAviso({ tipo, mensagem, fechar: true }));
      const area = navigator.clipboard;
      if (!area) { dizer('Não foi possível copiar o número.', 'erro'); return; }
      area.writeText(numero).then(() => dizer(`Número ${numero} copiado.`, 'sucesso'), () => dizer('Não foi possível copiar o número.', 'erro'));
    });
    caixa.append(texto, copiar);
    return caixa;
  }

  function dadosDoAlerta(a) {
    const abrir = DS.botao({ variante: 'primario', rotulo: 'Abrir atividade' });
    abrir.addEventListener('click', () => { location.href = 'area-de-trabalho.html'; });
    const descartar = DS.botao({ variante: 'secundario', rotulo: 'Descartar' });
    descartar.dataset.abrePainel = '';
    descartar.addEventListener('click', () => confirmarDescarte(a, descartar));
    return {
      titulo: a.titulo, chips: [TIPO[a.tipo]],
      destaque: { rotulo: 'Prazo', valor: DS.chipPrazo(DS.descreverPrazo(a.prazoEmDias)) },
      linhas: [
        { icone: 'arquivar', rotulo: 'Processo', valor: numeroComCopiar(a.processo) },
        { icone: 'pessoa', rotulo: 'Responsável', valor: a.responsavel },
        { icone: 'info', rotulo: 'Tipo', valor: TIPO[a.tipo] },
        { icone: 'calendario', rotulo: 'Data', valor: dataDoAlerta(a.prazoEmDias) },
      ],
      corpo: [], acoes: [descartar, abrir],
    };
  }

  function linhaDeDetalhe(lista, rotulo, ...conteudo) {
    const dt = document.createElement('dt');
    dt.textContent = rotulo;
    const dd = document.createElement('dd');
    dd.append(...conteudo);
    lista.append(dt, dd);
  }

  function detalhes(a) {
    const prazo = DS.descreverPrazo(a.prazoEmDias, a.status === 'concluido');
    const dl = document.createElement('dl');
    dl.className = 'detalhes';
    linhaDeDetalhe(dl, 'Data', DS.chipPrazo(prazo));
    linhaDeDetalhe(dl, 'Tipo', DS.tag({ rotulo: TIPO[a.tipo] }));
    const numero = document.createElement('span');
    numero.className = 'numero-processo';
    numero.textContent = a.processo;
    linhaDeDetalhe(dl, 'Processo', numero);
    linhaDeDetalhe(dl, 'Responsável', DS.avatar({ nome: a.responsavel, mostrarNome: true }));
    return dl;
  }

  function visualizar(a, origem) {
    const titulo = document.createElement('p');
    titulo.className = 'alerta-titulo';
    titulo.textContent = a.titulo;
    const conteudo = { titulo: TIPO[a.tipo], corpo: [titulo, detalhes(a)] };
    if (!painel) painel = DS.painelLateral(conteudo);
    else painel.trocar(conteudo);
    painel.abrir(origem);
  }

  // --- desenho -----------------------------------------------------------------

  function cardDeAlerta(a, aba) {
    const prazo = DS.descreverPrazo(a.prazoEmDias);
    const raiz = document.createElement('li');
    raiz.className = 'alerta';
    raiz.dataset.id = a.id;
    raiz.tabIndex = 0;

    const titulo = document.createElement('h2');
    titulo.className = 'alerta-titulo';
    titulo.id = `alerta-${aba}-${a.id}`;
    titulo.textContent = a.titulo;
    raiz.setAttribute('aria-labelledby', titulo.id);
    const motivo = document.createElement('p');
    motivo.className = 'alerta-motivo';
    motivo.append(MOTIVO[a.tipo], DS.chipPrazo(prazo));
    const texto = document.createElement('div');
    texto.className = 'alerta-texto';
    texto.append(motivo, titulo);

    const corpo = detalhes(a);
    corpo.id = `detalhes-${aba}-${a.id}`;
    const aberto = expandidos.has(a.id);
    corpo.hidden = !aberto;
    const expandir = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'seta', rotulo: 'Mostrar detalhes' });
    expandir.classList.add('alerta-expandir');
    expandir.setAttribute('aria-expanded', String(aberto));
    expandir.setAttribute('aria-controls', corpo.id);
    expandir.addEventListener('click', () => {
      if (expandidos.has(a.id)) expandidos.delete(a.id); else expandidos.add(a.id);
      const agora = expandidos.has(a.id);
      corpo.hidden = !agora;
      expandir.setAttribute('aria-expanded', String(agora));
      atualizarBarra();
    });

    const topo = document.createElement('div');
    topo.className = 'alerta-topo';
    topo.append(texto, expandir);

    const ver = DS.botao({ variante: 'texto', rotulo: 'Visualizar' });
    ver.dataset.abrePainel = '';
    ver.addEventListener('click', () => visualizar(a, ver));
    const concluir = DS.botao({ variante: 'secundario', iconeEsquerda: 'marca', rotulo: 'Concluir' });
    concluir.addEventListener('click', () => alterar(a, { status: 'concluido' }, `"${a.titulo}" concluída. O alerta saiu da lista.`));
    const reagendar = DS.menuAcoes({
      rotulo: 'Reagendar',
      itens: REAGENDAR.map(([dias, rotulo]) => ({
        rotulo,
        aoClicar: () => alterar(a, { prazoEmDias: dias },
          `"${a.titulo}" reagendada: agora ${DS.descreverPrazo(dias).rotulo.toLowerCase()}. O alerta saiu da lista.`),
      })),
    });
    const descartar = DS.botao({ variante: 'texto', rotulo: 'Descartar' });
    descartar.dataset.abrePainel = '';
    descartar.addEventListener('click', () => confirmarDescarte(a, descartar));

    raiz.append(topo, corpo, DS.grupoBotoes([ver, concluir, reagendar, descartar]));
    return raiz;
  }

  const ordemEl = DS.seletor({
    rotulo: 'Ordem', opcoes: ORDENS, valor: ordem, largura: 'm',
    aoEscolher: (valor) => { ordem = valor; desenhar(); },
  });
  const expandirTodos = DS.botao({ variante: 'texto', rotulo: 'Expandir todos' });
  expandirTodos.addEventListener('click', () => {
    const ids = alertasDa(abaAtual).map((a) => a.id);
    const fechar = ids.length && ids.every((id) => expandidos.has(id));
    ids.forEach((id) => (fechar ? expandidos.delete(id) : expandidos.add(id)));
    desenhar();
  });
  const barra = DS.barraFiltros({ rotulo: 'Lista de alertas', itens: [ordemEl, expandirTodos] });

  const conteudos = Object.fromEntries(ABAS.map(([chave]) => [chave, document.createElement('div')]));
  const abas = DS.abas({
    rotulo: 'Tipos de alerta', valor: abaAtual,
    itens: ABAS.map(([chave, rotulo]) => ({ chave, rotulo, conteudo: conteudos[chave] })),
    aoMudar: (chave) => { abaAtual = chave; atualizarBarra(); detalhe.sincronizar(alertasDa(abaAtual)); },
  });
  abas.querySelector('.abas-lista').after(barra.el);
  // Abaixo de 1100px o painel some e o item abre o painel lateral de Visualizar.
  const detalhe = detalheAoLado({
    pagina: 'alertas', lista: abas, rotulo: 'Alerta escolhido', dadosDe: dadosDoAlerta,
    rotulos: { anterior: 'Alerta anterior da lista', proximo: 'Próximo alerta da lista',
      esconder: 'Esconder o painel do alerta', mostrar: 'Mostrar o painel do alerta' },
    aoEstreita: (a) => visualizar(a, document.activeElement),
  });
  document.getElementById('alertas').append(detalhe.casca);
  const botoesDeAba = [...abas.querySelectorAll('[role="tab"]')];

  function atualizarBarra() {
    const ids = alertasDa(abaAtual).map((a) => a.id);
    expandirTodos.disabled = ids.length === 0;
    expandirTodos.textContent = ids.length && ids.every((id) => expandidos.has(id)) ? 'Recolher todos' : 'Expandir todos';
    barra.atualizar({ resultado: plural(ids.length, 'alerta', 'alertas') });
  }

  function desenhar() {
    ABAS.forEach(([chave, rotulo], indice) => {
      const lista = alertasDa(chave);
      botoesDeAba[indice].textContent = lista.length ? `${rotulo} (${lista.length})` : rotulo;
      if (!lista.length) {
        conteudos[chave].replaceChildren(DS.estadoVazio({ titulo: VAZIO }));
        return;
      }
      const ul = document.createElement('ul');
      ul.className = 'lista-alertas';
      ul.setAttribute('aria-label', `Alertas: ${rotulo}`);
      ul.append(...lista.map((a) => cardDeAlerta(a, chave)));
      conteudos[chave].replaceChildren(ul);
    });
    atualizarBarra();
    detalhe.sincronizar(alertasDa(abaAtual));
  }

  desenhar();
})();
</script>
</body>
</html>
