<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área de trabalho, Astrea: protótipo do Kanban</title>
<style>
/* primitivos */
:root {
  --primitive-blue-300: #6cc4f2;
  --primitive-blue-500: #008fd5;
  --primitive-blue-600: #0072ab;
  --primitive-blue-700: #005a87;
  --primitive-gray-0: #ffffff;
  --primitive-gray-50: #f3f5f7;
  --primitive-gray-100: #e8ecef;
  --primitive-gray-200: #d4dae0;
  --primitive-gray-400: #9aa6b2;
  --primitive-gray-500: #78838e;
  --primitive-gray-600: #56616c;
  --primitive-gray-700: #36414c;
  --primitive-gray-750: #2e3741;
  --primitive-gray-800: #242c34;
  --primitive-gray-850: #1c232a;
  --primitive-gray-900: #1b2127;
  --primitive-gray-950: #161c22;
  --primitive-red-300: #ff9a8f;
  --primitive-red-700: #b3261e;
  --primitive-amber-300: #f2b85b;
  --primitive-amber-800: #8a5100;

  --primitive-space-4: 4px;
  --primitive-space-8: 8px;
  --primitive-space-12: 12px;
  --primitive-space-16: 16px;
  --primitive-space-24: 24px;
  --primitive-space-32: 32px;

  --primitive-radius-4: 4px;
  --primitive-border-1: 1px;
  --primitive-border-2: 2px;

  --primitive-font-12: 12px;
  --primitive-font-14: 14px;
  --primitive-font-16: 16px;
  --primitive-font-20: 20px;
  --primitive-font-24: 24px;
  --primitive-weight-400: 400;
  --primitive-weight-500: 500;
  --primitive-weight-600: 600;
  --primitive-leading-125: 1.25;
  --primitive-leading-145: 1.45;

  --primitive-size-18: 18px;
  --primitive-size-32: 32px;
  --primitive-size-56: 56px;
  --primitive-size-240: 240px;
  --primitive-size-440: 440px;
}
/* fim dos primitivos */

/* semanticos */
:root {
  color-scheme: light dark;

  --color-bg-page: light-dark(var(--primitive-gray-0), var(--primitive-gray-950));
  --color-bg-surface: light-dark(var(--primitive-gray-0), var(--primitive-gray-800));
  --color-bg-subtle: light-dark(var(--primitive-gray-50), var(--primitive-gray-850));
  --color-bg-hover: light-dark(var(--primitive-gray-100), var(--primitive-gray-750));
  --color-text-default: light-dark(var(--primitive-gray-900), var(--primitive-gray-50));
  --color-text-muted: light-dark(var(--primitive-gray-600), var(--primitive-gray-400));
  --color-text-danger: light-dark(var(--primitive-red-700), var(--primitive-red-300));
  --color-text-warning: light-dark(var(--primitive-amber-800), var(--primitive-amber-300));
  --color-logo: light-dark(var(--primitive-blue-500), var(--primitive-blue-300));
  --color-border-default: light-dark(var(--primitive-gray-200), var(--primitive-gray-700));
  --color-border-strong: light-dark(var(--primitive-gray-500), var(--primitive-gray-500));
  --color-action: light-dark(var(--primitive-blue-600), var(--primitive-blue-500));
  --color-action-hover: light-dark(var(--primitive-blue-700), var(--primitive-blue-300));
  --color-action-text: light-dark(var(--primitive-gray-0), var(--primitive-gray-950));
  --color-focus: light-dark(var(--primitive-blue-600), var(--primitive-blue-300));

  --space-1: var(--primitive-space-4);
  --space-2: var(--primitive-space-8);
  --space-3: var(--primitive-space-12);
  --space-4: var(--primitive-space-16);
  --space-5: var(--primitive-space-24);
  --space-6: var(--primitive-space-32);

  --radius: var(--primitive-radius-4);
  --border-width: var(--primitive-border-1);
  --focus-width: var(--primitive-border-2);

  --font-sans: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-size-1: var(--primitive-font-12);
  --font-size-2: var(--primitive-font-14);
  --font-size-3: var(--primitive-font-16);
  --font-size-4: var(--primitive-font-20);
  --font-size-5: var(--primitive-font-24);
  --font-weight-regular: var(--primitive-weight-400);
  --font-weight-medium: var(--primitive-weight-500);
  --font-weight-semibold: var(--primitive-weight-600);
  --font-leading-tight: var(--primitive-leading-125);
  --font-leading-base: var(--primitive-leading-145);

  --size-icon: var(--primitive-size-18);
  --size-control: var(--primitive-size-32);
  --size-header: var(--primitive-size-56);
  --size-sidebar: var(--primitive-size-240);
  --size-search: var(--primitive-size-440);
}
:root:has(#tema-claro:checked) { color-scheme: light; }
:root:has(#tema-escuro:checked) { color-scheme: dark; }
/* fim dos semanticos */

/* componentes */
:root {
  --component-header-height: var(--size-header);
  --component-header-bg: var(--color-bg-page);
  --component-sidebar-width: var(--size-sidebar);
  --component-menu-item-active-bg: var(--color-bg-subtle);
  --component-card-bg: var(--color-bg-surface);
}
/* fim dos componentes */

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-padding-top: calc(var(--component-header-height) + var(--space-4));
}

body {
  margin: 0;
  background-color: var(--color-bg-page);
  color: var(--color-text-default);
  font-family: var(--font-sans);
  font-size: var(--font-size-2);
  line-height: var(--font-leading-base);
}

:focus-visible {
  outline: var(--focus-width) solid var(--color-focus);
  outline-offset: var(--focus-width);
}

button, input { font: inherit; color: inherit; }

svg.icone {
  width: var(--size-icon);
  height: var(--size-icon);
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pular {
  position: absolute;
  left: var(--space-4);
  top: calc(-1 * var(--component-header-height));
  z-index: 2;
  padding: var(--space-2) var(--space-3);
  background-color: var(--color-bg-surface);
  color: var(--color-text-default);
  border: var(--border-width) solid var(--color-border-strong);
  border-radius: var(--radius);
}
.pular:focus { top: var(--space-2); }

/* cabeçalho */
.cabecalho {
  position: sticky;
  top: 0;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--component-sidebar-width) minmax(0, 1fr) auto;
  align-items: center;
  column-gap: var(--space-5);
  height: var(--component-header-height);
  padding-right: var(--space-5);
  background-color: var(--component-header-bg);
  border-bottom: var(--border-width) solid var(--color-border-default);
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  justify-self: start;
  margin-left: var(--space-5);
  color: var(--color-logo);
  font-size: var(--font-size-5);
  font-weight: var(--font-weight-regular);
  line-height: var(--font-leading-tight);
  text-decoration: none;
}
.logo svg { width: var(--size-icon); height: var(--size-icon); fill: currentColor; }

.busca {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  max-width: var(--size-search);
}
.busca label { color: var(--color-text-muted); }
.busca-campo {
  position: relative;
  flex: 1;
  min-width: 0;
}
.busca input {
  width: 100%;
  height: var(--size-control);
  padding: 0 var(--space-6) 0 var(--space-3);
  background-color: var(--color-bg-surface);
  border: var(--border-width) solid var(--color-border-strong);
  border-radius: var(--radius);
}
.busca input::placeholder { color: var(--color-text-muted); }
.busca-campo svg {
  position: absolute;
  right: var(--space-2);
  top: 50%;
  translate: 0 -50%;
  color: var(--color-text-muted);
  pointer-events: none;
}

.acoes {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
.atalhos {
  display: flex;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  list-style: none;
}
.atalho {
  display: inline-grid;
  place-items: center;
  width: var(--size-control);
  height: var(--size-control);
  padding: 0;
  background: none;
  border: 0;
  border-radius: var(--radius);
  color: var(--color-text-muted);
  cursor: pointer;
}
.atalho:hover { background-color: var(--color-bg-hover); color: var(--color-text-default); }
.atalho-ia {
  font-size: var(--font-size-1);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-tight);
}

.tema {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin: 0;
  padding: 0;
  border: 0;
  font-size: var(--font-size-1);
}
.tema legend {
  float: left;
  padding: 0;
  margin-right: var(--space-1);
  color: var(--color-text-muted);
}
.tema label {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  cursor: pointer;
}
.tema input { margin: 0; accent-color: var(--color-action); }

.usuario {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  height: var(--size-control);
  padding: 0 var(--space-2);
  background: none;
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
}
.usuario:hover { background-color: var(--color-bg-hover); }

/* corpo: menu lateral e conteúdo */
.corpo {
  display: grid;
  grid-template-columns: var(--component-sidebar-width) minmax(0, 1fr);
  min-height: calc(100vh - var(--component-header-height));
}

.menu-lateral {
  position: sticky;
  top: var(--component-header-height);
  align-self: start;
  height: calc(100vh - var(--component-header-height));
  overflow-y: auto;
  padding: var(--space-4) var(--space-3);
  border-right: var(--border-width) solid var(--color-border-default);
}
.menu-lateral ul { margin: 0; padding: 0; list-style: none; }
.menu-lateral hr {
  margin: var(--space-3) 0;
  border: 0;
  border-top: var(--border-width) solid var(--color-border-default);
}
.menu-lateral a {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--size-control);
  padding: 0 var(--space-3);
  border-radius: var(--radius);
  color: var(--color-text-muted);
  text-decoration: none;
}
.menu-lateral a:hover { background-color: var(--color-bg-hover); color: var(--color-text-default); }
.menu-lateral a[aria-current="page"] {
  background-color: var(--component-menu-item-active-bg);
  color: var(--color-text-default);
  font-weight: var(--font-weight-semibold);
}

#conteudo {
  min-width: 0;
  padding: var(--space-5) var(--space-6) var(--space-6);
}
#conteudo h1 {
  margin: 0 0 var(--space-5);
  font-size: var(--font-size-5);
  font-weight: var(--font-weight-semibold);
  line-height: var(--font-leading-tight);
}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="cabecalho">
  <a class="logo" href="#conteudo">
    <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M0 4h14v14H0z"/><path d="M14 0h4v4h-4z"/></svg>
    astrea

  <form class="busca" role="search" onsubmit="return false">
    <label for="busca-global">Buscar</label>
    <div class="busca-campo">
      <input id="busca-global" type="search" placeholder="Contato, processo ou atividade" autocomplete="off">

      </button></li>
      <li><button type="button" class="atalho" aria-label="Configurações" title="Configurações">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button></li>
    </ul>

    <fieldset class="tema">
      <legend>Tema</legend>
      <label><input type="radio" name="tema" id="tema-sistema" checked> Sistema</label>
      <label><input type="radio" name="tema" id="tema-claro"> Claro</label>
      <label><input type="radio" name="tema" id="tema-escuro"> Escuro</label>
    </fieldset>

    <button type="button" class="usuario">
      Helena Duarte
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg>
    </button>
  </div>
</header>

<div class="corpo">
  <nav class="menu-lateral" aria-label="Menu principal">
    <ul>
      <li><a href="#conteudo" aria-current="page">

        Publicações</a></li>
      <li><a href="#">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M16 7.5C15 6 13.6 5.5 12 5.5c-2.2 0-4 1-4 3s1.8 2.6 4 3.2 4 1.2 4 3.3-1.8 3.2-4 3.2c-1.7 0-3.1-.6-4-2"/></svg>
        Financeiro</a></li>
      <li><a href="#">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11l-7.5 7.5a4.6 4.6 0 0 1-6.5-6.5L13 4a3 3 0 0 1 4.3 4.3l-7.6 7.6a1.5 1.5 0 0 1-2.1-2.1L14.5 7"/></svg>

    <ul>

        Suporte</a></li>
    </ul>
  </nav>

  <main id="conteudo">
    <h1>Área de trabalho</h1>
    <div id="ferramentas"></div>
    <div id="quadro"></div>

</div>
</body>
