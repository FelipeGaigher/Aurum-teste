<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentos, Astrea: protótipo</title>
<link rel="stylesheet" href="astrea.css">
<script src="moldura.js"></script>
<script src="componentes.js"></script>
<script src="dados.js"></script>
<style>
  /* Barra de filtros no padrão de Contatos; o atalho para os modelos fica ao lado da ação de criar (PA-86). */
  #conteudo > .barra-filtros { margin-bottom: var(--space-4); }

  /* Formato da lista: o mesmo controle segmentado de contatos.html (PA-64). */
  .formato {
    display: inline-flex;
    gap: var(--border-width);
    padding: var(--border-width);
    background-color: var(--color-bg-subtle);
    border: var(--border-width) solid var(--color-border-default);
    border-radius: var(--radius);
  }
  .formato-opcao {
    min-height: calc(var(--component-control-height) - var(--space-1));
    padding: 0 var(--space-3);
    background: none;
    border: var(--border-width) solid transparent;
    border-radius: var(--radius);
    color: var(--color-text-default);
    font: inherit;
    font-size: var(--font-size-button);
    cursor: pointer;
  }
  .formato-opcao:hover { background-color: var(--color-bg-hover); }
  .formato-opcao[aria-checked="true"] {
    background-color: var(--color-bg-surface);
    border-color: var(--color-border-strong);
    font-weight: var(--font-weight-semibold);
  }

  .documentos-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--component-column-width)), 1fr));
    gap: var(--space-3);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .resumo { display: grid; gap: var(--space-2); margin: 0; }
  .resumo div { display: grid; gap: var(--space-1); }
  .resumo dt { color: var(--color-text-muted); font-size: var(--font-size-label); }
  .resumo dd { margin: 0; overflow-wrap: anywhere; }
  .passo-nota { margin: 0; color: var(--color-text-muted); }
  .documentos-aviso:empty { display: none; }
  .documentos-aviso { margin-bottom: var(--space-4); }
</style>
</head>
<body data-pagina="documentos.html" data-titulo="Documentos">
<div class="corpo">
  <main id="conteudo">
    <div id="topo"></div>
    <div class="documentos-aviso" id="documentos-aviso"></div>
    <div id="lista"></div>
  </main>
</div>
<script>
(function () {
  const { CONTATOS, PROCESSOS, RESPONSAVEIS } = window.DADOS;
  // O usuário logado da moldura, que o Astrea traz como responsável padrão.
  const EU = 'Marina Couto';
  // Os quatro modelos padrão da conta. O Astrea deixa o autor vazio (PA-87).
  const MODELOS = [
    { chave: 'honorarios-pf', titulo: 'Contrato de Honorários PF', autor: '', data: '07/11/2026' },
    { chave: 'honorarios-pj', titulo: 'Contrato de Honorários PJ', autor: '', data: '07/11/2026' },
    { chave: 'procuracao-pf', titulo: 'Procuração PF', autor: '', data: '07/11/2026' },
    { chave: 'procuracao-pj', titulo: 'Procuração PJ', autor: '', data: '07/11/2026' },
  ];
  const AUTOR_PADRAO = 'Modelo do Astrea';
  const PASSOS = ['Dados do documento', 'Conteúdo do documento'];

  const opcoes = {
    modelo: [['', 'Selecione um modelo'], ...MODELOS.map((m) => [m.chave, m.titulo])],
    processo: [['', 'Nenhum'], ...PROCESSOS.map((p) => [p.numero, p.numero])],
    cliente: [['', 'Selecione um cliente'], ...CONTATOS.map((c) => [c.id, c.nome])],
    responsavel: RESPONSAVEIS.map((nome) => [nome, nome]),
  };
  const rotuloDe = (campo, chave) => opcoes[campo].find(([c]) => c === chave)[1];

  // Os documentos que já existem moram nas fichas de contato. O criado aqui entra no topo.
  const documentos = Object.entries(window.DADOS.DOCUMENTOS_DE_CONTATO || {}).flatMap(([idContato, lista]) => {
    const contato = CONTATOS.find((c) => c.id === idContato);
    return lista.map((d) => ({ ...d, contato: contato ? contato.nome : '', origem: contato ? `Ficha de ${contato.nome}` : '' }));
  }).sort((x, y) => y.enviadoEm.localeCompare(x.enviadoEm));
  let criados = 0;
  let painel = null;
  let formulario = null;
  let origem = null;

  function juntar(nomes) {
    return nomes.length > 1 ? `${nomes.slice(0, -1).join(', ')} e ${nomes.at(-1)}` : nomes[0];
  }

  function abrirPainel(conteudo, de) {
    if (painel) painel.trocar(conteudo);
    else painel = DS.painelLateral(conteudo);
    painel.abrir(de);
  }

  // --- documento padrão: dois passos com indicador (PA-85) -------------------

  function montarFormulario() {
    const valores = { modelo: '', processo: '', cliente: '', titulo: '', responsavel: EU };
    const escolher = (campo) => (v) => { valores[campo] = v; };
    const pecas = [
      DS.seletor({ rotulo: 'Documento', obrigatorio: true, largura: 'total', opcoes: opcoes.modelo, aoEscolher: escolher('modelo') }),
      DS.seletor({ rotulo: 'Processo, caso ou atendimento', largura: 'total', opcoes: opcoes.processo, aoEscolher: escolher('processo') }),
      DS.seletor({ rotulo: 'Cliente', obrigatorio: true, largura: 'total', opcoes: opcoes.cliente, aoEscolher: escolher('cliente') }),
      DS.campo({ rotulo: 'Título', obrigatorio: true, largura: 'total', aoMudar: (v) => { valores.titulo = v.trim(); } }),
      DS.seletor({ rotulo: 'Responsável', obrigatorio: true, largura: 'total', opcoes: opcoes.responsavel, valor: EU, aoEscolher: escolher('responsavel') }),
    ];
    return { valores, pecas };
  }

  function indicador(atual) {
    return DS.stepper({ rotulo: 'Passos do documento padrão', passos: PASSOS, atual, aoIr: () => painel.trocar(passoDados()) });
  }

  function faltando() {
    const v = formulario.valores;
    return [[!v.modelo, 'Documento'], [!v.cliente, 'Cliente'], [!v.titulo, 'Título']]
      .filter(([falta]) => falta).map(([, nome]) => nome);
  }

  function passoDados() {
    const barra = DS.barraAcoes({
      rotulo: 'Ações do documento padrão',
      acoes: [
        { variante: 'texto', rotulo: 'Cancelar', aoClicar: () => painel.fechar() },
        { variante: 'primario', rotulo: 'Continuar', iconeDireita: 'direita', aoClicar: () => {
          const faltam = faltando();
          if (faltam.length) { barra.definirSituacao('erro', `Preencha ${juntar(faltam)}.`); return; }
          painel.trocar(passoConteudo());
        } },
      ],
    });
    return { titulo: 'Documento padrão', corpo: [indicador(0), ...formulario.pecas], rodape: barra.el };
  }

  function linhaDoResumo(termo, valor) {
    const div = document.createElement('div');
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = termo;
    dd.textContent = valor;
    div.append(dt, dd);
    return div;
  }

  function passoConteudo() {
    const v = formulario.valores;
    const resumo = document.createElement('dl');
    resumo.className = 'resumo';
    resumo.append(
      linhaDoResumo('Documento', rotuloDe('modelo', v.modelo)),
      linhaDoResumo('Cliente', rotuloDe('cliente', v.cliente)),
      linhaDoResumo('Título', v.titulo),
      linhaDoResumo('Responsável', v.responsavel),
    );
    const nota = document.createElement('p');
    nota.className = 'passo-nota';
    nota.textContent = 'O texto do modelo é preenchido com estes dados ao concluir.';
    const barra = DS.barraAcoes({
      rotulo: 'Ações do documento padrão',
      acoes: [
        { variante: 'secundario', rotulo: 'Voltar', aoClicar: () => painel.trocar(passoDados()) },
        { variante: 'primario', rotulo: 'Concluir', aoClicar: concluir },
      ],
    });
    return { titulo: 'Documento padrão', corpo: [indicador(1), resumo, nota], rodape: barra.el };
  }

  function concluir() {
    const v = formulario.valores;
    criados += 1;
    documentos.unshift({
      id: `novo-${criados}`,
      nome: v.titulo,
      tipo: '',
      enviadoEm: new Date().toISOString().slice(0, 10),
      enviadoPor: v.responsavel,
      processo: v.processo,
      contato: rotuloDe('cliente', v.cliente),
      origem: `Modelo ${rotuloDe('modelo', v.modelo)}`,
    });
    painel.fechar();
    desenhar();
  }

  function abrirDocumentoPadrao() {
    formulario = montarFormulario();
    abrirPainel(passoDados(), origem);
  }

  // --- modelos: atalho em Documentos (PA-86) ----------------------------------

  function conteudoDosModelos() {
    return {
      titulo: 'Modelos de documento',
      corpo: [DS.tabela({
        rotulo: 'Modelos de documento',
        colunas: [['titulo', 'Título'], ['autor', 'Autor'], ['data', 'Data']],
        linhas: MODELOS.map((m) => ({ ...m, autor: m.autor || AUTOR_PADRAO })),
      })],
    };
  }

  // --- topo e lista ----------------------------------------------------------

  const atalhoModelos = DS.botao({ variante: 'texto', rotulo: 'Modelos de documento' });
  atalhoModelos.setAttribute('data-abre-painel', '');
  atalhoModelos.setAttribute('aria-haspopup', 'dialog');
  atalhoModelos.addEventListener('click', () => abrirPainel(conteudoDosModelos(), atalhoModelos));

  // Documento abre o seletor de arquivos e Link não foi aberto na varredura: ficam no menu, desligados.
  const menuAdicionar = DS.menuAcoes({
    rotulo: 'Adicionar documento',
    itens: [
      { rotulo: 'Documento', desabilitado: true },
      { rotulo: 'Link', desabilitado: true },
      { rotulo: 'Documento padrão', aoClicar: abrirDocumentoPadrao },
    ],
  });
  origem = menuAdicionar.querySelector('button');

  // --- barra de filtros e formato (o mesmo arranjo de contatos.html) ----------

  const CHAVE_VISAO = 'astrea-documentos-visao';
  const VISOES = [['tabela', 'Tabela'], ['cards', 'Cards']];
  const TIPOS = [['', 'Todos'], ['PDF', 'PDF'], ['DOCX', 'DOCX'], ['Imagem', 'Imagem']];
  const lerVisao = () => {
    let salva = null;
    try { salva = localStorage.getItem(CHAVE_VISAO); } catch (e) { salva = null; }
    return VISOES.some(([chave]) => chave === salva) ? salva : 'tabela';
  };
  const gravarVisao = (visao) => { try { localStorage.setItem(CHAVE_VISAO, visao); } catch (e) { /* sem armazenamento */ } };
  const estado = { busca: '', tipo: '', visao: lerVisao() };
  // Busca sem acento e sem diferença de maiúscula: "procuracao" acha "Procuração".
  const normalizar = (texto) => (texto || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  function filtrados() {
    const termo = normalizar(estado.busca.trim());
    return documentos.filter((d) => (!estado.tipo || d.tipo === estado.tipo)
      && (!termo || [d.nome, d.processo, d.contato].some((v) => normalizar(v).includes(termo))));
  }

  const busca = DS.busca({
    rotulo: 'Buscar documento', largura: 'm', placeholder: 'Nome, processo ou contato',
    aoMudar: (valor) => { estado.busca = valor; desenhar(); },
  });
  const tipo = DS.seletor({
    rotulo: 'Tipo', largura: 'p', opcoes: TIPOS, valor: '',
    aoEscolher: (valor) => { estado.tipo = valor; desenhar(); },
  });

  const formato = document.createElement('div');
  formato.className = 'formato';
  formato.setAttribute('role', 'radiogroup');
  formato.setAttribute('aria-label', 'Formato da lista');
  const opcoesDeFormato = VISOES.map(([chave, rotulo]) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'formato-opcao';
    el.textContent = rotulo;
    el.setAttribute('role', 'radio');
    el.dataset.visao = chave;
    el.setAttribute('aria-controls', 'documentos-resultado');
    el.addEventListener('click', () => escolherVisao(chave));
    return el;
  });
  formato.append(...opcoesDeFormato);
  formato.addEventListener('keydown', (e) => {
    const passo = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!passo) return;
    e.preventDefault();
    const atual = VISOES.findIndex(([chave]) => chave === estado.visao);
    escolherVisao(VISOES[(atual + passo + VISOES.length) % VISOES.length][0], true);
  });

  function marcarVisao() {
    opcoesDeFormato.forEach((el) => {
      const marcada = el.dataset.visao === estado.visao;
      el.setAttribute('aria-checked', String(marcada));
      el.tabIndex = marcada ? 0 : -1;
    });
  }

  function escolherVisao(visao, focar) {
    estado.visao = visao;
    gravarVisao(visao);
    marcarVisao();
    desenhar();
    if (focar) opcoesDeFormato.find((el) => el.dataset.visao === visao).focus();
  }

  const barra = DS.barraFiltros({ rotulo: 'Filtros de documentos', itens: [busca, tipo], visao: formato, acoes: [atalhoModelos, menuAdicionar] });
  document.getElementById('topo').replaceWith(barra.el);
  marcarVisao();

  // --- detalhe ao lado da lista (o mesmo arranjo de contatos.html) ----------

  function detalheAoLado(cfg) {
    const { pagina, lista, rotulo, rotulos, dadosDe, aoEstreita } = cfg;
    const chave = (s) => `astrea-${pagina}-detalhe-${s}`;
    const ler = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } };
    const estreita = window.matchMedia('(max-width: 1100px)');
    let escolhido = ler(chave('id'));
    let itens = [];
    const atual = () => itens.find((x) => x.id === escolhido) || itens[0];
    const andar = (passo) => {
      const i = itens.indexOf(atual());
      escolher(itens[(i + passo + itens.length) % itens.length].id);
    };
    const detalhe = DS.painelDetalhe({
      rotulo, rotulos,
      aoAnterior: () => andar(-1),
      aoProximo: () => andar(1),
      aoFechar: () => { gravar(chave('oculto'), '1'); divisor.el.hidden = true; },
      aoReabrir: () => { gravar(chave('oculto'), ''); divisor.el.hidden = false; },
    });
    detalhe.el.id = `${pagina}-detalhe`;
    const divisor = DS.divisorRedimensionavel({
      alvo: detalhe.el, rotulo: 'Largura do painel de detalhe', minimo: 300, maximo: 560, padrao: 380,
      chave: chave('largura'), reserva: 480,
    });
    const casca = document.createElement('div');
    casca.className = 'lista-e-detalhe';
    casca.append(lista, divisor.el, detalhe.el);
    if (ler(chave('oculto')) === '1') { detalhe.esconder(); divisor.el.hidden = true; }

    function marcar(id) {
      lista.querySelectorAll('[data-id]').forEach((el) => {
        const sim = el.dataset.id === id;
        if (el.tagName === 'TR') { el.setAttribute('aria-selected', String(sim)); return; }
        el.classList.toggle('is-selecionado', sim);
        if (sim) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
      });
    }
    function sincronizar(novos) {
      itens = novos;
      const x = atual();
      detalhe.el.hidden = !x;
      divisor.el.hidden = !x || detalhe.oculto();
      marcar(x ? x.id : '');
      if (x) detalhe.mostrar({ ...dadosDe(x), navegavel: itens.length > 1 });
    }
    function escolher(id) {
      const x = itens.find((i) => i.id === id);
      if (!x) return;
      if (estreita.matches) { if (aoEstreita) aoEstreita(x); return; }
      escolhido = id;
      gravar(chave('id'), id);
      if (detalhe.oculto()) { detalhe.reabrir(); divisor.el.hidden = false; gravar(chave('oculto'), ''); }
      sincronizar(itens);
    }
    // O botão e o link de dentro do item seguem a própria ação; o resto do item escolhe.
    lista.addEventListener('click', (e) => {
      const alvo = e.target.closest('[data-id]');
      if (alvo && lista.contains(alvo) && !e.target.closest('a, button, [role="menu"]')) escolher(alvo.dataset.id);
    });
    lista.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.matches('[data-id]')) { e.preventDefault(); escolher(e.target.dataset.id); }
    });
    return { casca, sincronizar };
  }

  const dataBr = (iso) => (iso ? iso.split('-').reverse().join('/') : '');
  const tamanho = (kb) => {
    if (!kb) return '';
    return kb >= 1024 ? `${(kb / 1024).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} MB` : `${kb} KB`;
  };

  function avisar(mensagem) {
    document.getElementById('documentos-aviso').replaceChildren(DS.faixaAviso({ tipo: 'info', mensagem, fechar: true }));
  }

  function dadosDoDocumento(d) {
    const baixar = DS.botao({ variante: 'secundario', iconeEsquerda: 'arquivar', rotulo: 'Baixar' });
    baixar.addEventListener('click', () => avisar(`O protótipo não guarda o arquivo ${d.nome}. Baixar fica para a versão com armazenamento.`));
    const mais = DS.botao({ variante: 'secundario', iconeEsquerda: 'opcoes', rotulo: 'Mais ações' });
    mais.addEventListener('click', () => avisar('Renomear, mover e excluir o documento ficam para uma próxima versão.'));
    return {
      titulo: d.nome, chips: d.tipo ? [d.tipo] : [],
      destaque: d.processo ? { rotulo: 'Processo ligado', valor: d.processo } : { rotulo: 'Contato ligado', valor: d.contato },
      linhas: [
        { icone: 'pessoa', rotulo: 'Enviado por', valor: d.enviadoPor },
        { icone: 'calendario', rotulo: 'Data', valor: dataBr(d.enviadoEm) },
        { icone: 'info', rotulo: 'Tamanho', valor: tamanho(d.tamanhoKb) },
        { icone: 'arquivar', rotulo: 'Pasta ou origem', valor: d.origem },
      ],
      corpo: [], acoes: [mais, baixar],
    };
  }

  const vagaDaLista = document.createElement('div');
  vagaDaLista.id = 'documentos-resultado';
  const detalhe = detalheAoLado({
    pagina: 'documentos', lista: vagaDaLista, rotulo: 'Documento escolhido', dadosDe: dadosDoDocumento,
    rotulos: { anterior: 'Documento anterior da lista', proximo: 'Próximo documento da lista',
      esconder: 'Esconder o painel do documento', mostrar: 'Mostrar o painel do documento' },
  });
  document.getElementById('lista').append(detalhe.casca);

  function desenharTabela(itens) {
    const quadro = DS.tabela({
      rotulo: 'Documentos',
      colunas: [['nome', 'Nome'], ['tipo', 'Tipo'], ['ligado', 'Processo ou contato'], ['enviadoPor', 'Enviado por'], ['data', 'Data']],
      linhas: itens.map((d) => ({
        nome: d.nome, tipo: d.tipo ? DS.tag({ rotulo: d.tipo }) : '', ligado: d.processo || d.contato,
        enviadoPor: d.enviadoPor, data: dataBr(d.enviadoEm),
      })),
    });
    quadro.querySelectorAll('tbody tr').forEach((tr, i) => {
      tr.dataset.id = itens[i].id;
      tr.dataset.selecionavel = '';
      tr.tabIndex = 0;
    });
    return quadro;
  }

  // Card de registro do DS: o nome do arquivo no topo, o processo em destaque com copiar.
  function cardDoDocumento(d) {
    const card = DS.cardRegistro({
      titulo: d.nome,
      chip: d.tipo || null,
      destaque: d.processo ? { rotulo: 'Processo', valor: d.processo, copiar: d.processo } : { rotulo: 'Contato', valor: d.contato },
      linhas: [
        { rotulo: 'Enviado por', valor: d.enviadoPor, pessoa: true },
        { rotulo: 'Data', valor: dataBr(d.enviadoEm) },
        { rotulo: 'Tamanho', valor: tamanho(d.tamanhoKb) },
      ],
      selecionavel: true,
    });
    card.dataset.id = d.id;
    return card;
  }

  function desenharCards(itens) {
    const ul = document.createElement('ul');
    ul.className = 'documentos-cards';
    ul.setAttribute('aria-label', 'Documentos');
    ul.append(...itens.map((d) => {
      const li = document.createElement('li');
      li.append(cardDoDocumento(d));
      return li;
    }));
    return ul;
  }

  function vazio() {
    if (!documentos.length) {
      return DS.estadoVazio({
        titulo: 'Crie, padronize e gerencie seus documentos',
        texto: 'Use Adicionar documento e escolha Documento padrão para gerar um contrato ou uma procuração a partir dos modelos.',
      });
    }
    const termo = estado.busca.trim();
    const doTipo = estado.tipo ? ` do tipo ${estado.tipo}` : '';
    return DS.estadoVazio({
      titulo: termo ? `Nenhum documento${doTipo} para "${termo}"` : `Nenhum documento${doTipo}`,
      texto: 'Procure por outro nome, processo ou contato, ou escolha Todos em Tipo.',
    });
  }

  function desenhar() {
    const itens = filtrados();
    const total = itens.length;
    barra.atualizar({ resultado: `${total} ${total === 1 ? 'documento' : 'documentos'}` });
    vagaDaLista.dataset.visao = estado.visao;
    if (!total) vagaDaLista.replaceChildren(vazio());
    else vagaDaLista.replaceChildren(estado.visao === 'cards' ? desenharCards(itens) : desenharTabela(itens));
    detalhe.sincronizar(itens);
  }

  desenhar();
  if (new URLSearchParams(location.search).get('adicionar') === '1') abrirDocumentoPadrao();
})();
</script>
</body>
</html>
