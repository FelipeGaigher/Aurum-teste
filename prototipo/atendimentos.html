<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimentos, Astrea: protótipo</title>
<link rel="stylesheet" href="astrea.css">
<script src="moldura.js"></script>
<script src="componentes.js"></script>
<script src="dados.js"></script>
<style>
  /* PA-83: o 1º Registro nasce do tamanho de duas linhas e cresce com o texto. */
  .registro-crescente .campo-area {
    field-sizing: content;
    resize: none;
    max-height: calc(var(--component-field-area-min-height) * 4);
  }

  /* Lista: filtros e o botão primário na mesma linha, o botão à direita. */
  .lista-filtros { margin-bottom: var(--space-4); }
  .pagina-aviso:empty { display: none; }
  .pagina-aviso { margin-bottom: var(--space-4); }
  .tabela a { border-radius: var(--radius); color: var(--color-action); font-weight: var(--font-weight-medium); }

  /* Formato da lista no controle segmentado de contatos.html: o marcado ganha fundo e peso, nunca só a cor. */
  .formato {
    display: inline-flex;
    gap: var(--border-width);
    padding: var(--border-width);
    background-color: var(--color-bg-subtle);
    border: var(--border-width) solid var(--color-border-default);
    border-radius: var(--radius);
  }
  .formato-opcao {
    min-height: calc(var(--component-control-height) - var(--space-1));
    padding: 0 var(--space-3);
    background: none;
    border: var(--border-width) solid transparent;
    border-radius: var(--radius);
    color: var(--color-text-default);
    font: inherit;
    font-size: var(--font-size-button);
    cursor: pointer;
  }
  .formato-opcao:hover { background-color: var(--color-bg-hover); }
  .formato-opcao[aria-checked="true"] {
    background-color: var(--color-bg-surface);
    border-color: var(--color-border-strong);
    font-weight: var(--font-weight-semibold);
  }

  /* Cards: a grade de contatos.html; o status no canto do topo. */
  .atendimentos-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--component-column-width)), 1fr));
    gap: var(--space-3);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .detalhe-numero { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); }
  .detalhe-anotacoes-titulo { margin: 0 0 var(--space-2); font-size: var(--font-size-emphasis); font-weight: var(--font-weight-semibold); }
  .tabela .numero-processo, .ficha-leitura .numero-processo { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .texto-apagado { color: var(--color-text-muted); }

  /* O status diz o nome; a borda e o fundo reforçam. */
  .chip-status-andamento { border-color: var(--color-action); }
  .chip-status-aguardando { background-color: var(--color-bg-warning); border-color: var(--color-text-warning); }
  .chip-status-concluido { background-color: var(--color-bg-surface); border-color: var(--color-text-success); }

  /* Ficha: cabeçalho de leitura em uma linha que quebra. */
  .ficha-topo { display: grid; gap: var(--space-3); margin-bottom: var(--space-5); }
  .ficha-leitura { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin: 0; min-width: 0; }
  .ficha-leitura div { display: grid; gap: var(--space-1); min-width: 0; }
  .ficha-leitura dt { color: var(--color-text-muted); font-size: var(--font-size-label); }
  .ficha-leitura dd { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); margin: 0; overflow-wrap: anywhere; }
  .ficha-etiquetas { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0; }
  .ficha-etiquetas .tag { padding-right: 0; }

  .ficha-grade { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--space-5) var(--space-6); align-items: start; }
  .ficha-coluna { display: grid; gap: var(--space-4); min-width: 0; align-content: start; }
  /* Cada bloco da ficha é um contêiner (pedido de Felipe: as informações estavam soltas). */
  .bloco { min-width: 0; padding: var(--space-4) var(--space-5); background-color: var(--component-card-bg); border: var(--border-width) solid var(--component-card-border); border-radius: var(--radius-card); }
  .ficha-topo { padding: var(--space-4) var(--space-5); background-color: var(--component-card-bg); border: var(--border-width) solid var(--component-card-border); border-radius: var(--radius-card); }
  .bloco-cabeca {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
    padding-bottom: var(--space-2);
    border-bottom: var(--border-width) solid var(--color-border-accent);
  }
  .bloco-cabeca h2 { margin: 0; font-size: var(--font-size-emphasis); font-weight: var(--font-weight-semibold); line-height: var(--font-leading-tight); }
  .bloco-valor { margin: 0; font-size: var(--font-size-dialog); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }
  .bloco-nota { margin: var(--space-1) 0 0; color: var(--color-text-muted); }

  /* Linha do tempo: a mais recente em cima, avatar sobre o trilho. */
  .anotacoes { display: grid; margin: 0; padding: 0; list-style: none; }
  .anotacoes li { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-3); }
  .anotacao-trilho { display: flex; flex-direction: column; align-items: center; }
  .anotacao-trilho::after { content: ""; flex: 1 1 auto; min-height: var(--space-3); border-left: var(--border-width) solid var(--color-border-default); }
  .anotacoes li:last-child .anotacao-trilho::after { border-left-color: transparent; }
  .anotacao-corpo { display: grid; gap: var(--space-1); padding-bottom: var(--space-4); min-width: 0; }
  .anotacao-cabeca { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-2); margin: 0; }
  .anotacao-autor { font-weight: var(--font-weight-semibold); }
  .anotacao-cabeca time { color: var(--color-text-muted); font-size: var(--font-size-label); font-variant-numeric: tabular-nums; }
  .anotacao-texto { margin: 0; overflow-wrap: anywhere; }
  .anotacao-nova .anotacao-autor::after { content: " · agora"; color: var(--color-text-muted); font-weight: var(--font-weight-regular); }

  .compositor { display: grid; gap: var(--space-3); padding-top: var(--space-4); border-top: var(--border-width) solid var(--color-border-default); }
  .compositor .barra-acoes { position: static; padding: 0; border-top: 0; background-color: transparent; }

  .participantes { display: grid; gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  .participantes li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); min-width: 0; }
  .participante-papel { color: var(--color-text-muted); font-size: var(--font-size-label); }

  /* Na coluna estreita, a linha de atividade empilha como no celular. */
  .ficha-grade .linha-atividade {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "prazo acoes" "principal principal" "pessoa pessoa";
  }
  .ficha-grade .linha-prazo { grid-area: prazo; }
  .ficha-grade .linha-principal { grid-area: principal; }
  .ficha-grade .linha-processo { display: none; }
  .ficha-grade .linha-responsavel { grid-area: pessoa; }
  .ficha-grade .linha-acoes { grid-area: acoes; }

  @media (max-width: 1024px) {
    .ficha-grade { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body data-pagina="atendimentos.html" data-titulo="Atendimentos">
<div class="corpo">
  <main id="conteudo"></main>
</div>
<script>
(function () {
  window.Moldura.montar();
  const { CONTATOS, PROCESSOS, RESPONSAVEIS, ATIVIDADES, ATENDIMENTOS, ANOTACOES_DE_ATENDIMENTO } = window.DADOS;
  const PAGINA = 'atendimentos.html';
  const MODULO = 'Atendimentos';
  const EU = window.Moldura.USUARIO || 'Marina Couto';
  const parametros = new URLSearchParams(location.search);
  const conteudo = document.getElementById('conteudo');

  // Etiquetas inventadas para o protótipo. O Astrea mostra o campo só com o ícone.
  const ETIQUETAS = [['', 'Sem etiqueta'], ['consulta', 'Consulta inicial'], ['retorno', 'Retorno'], ['acordo', 'Acordo']];
  const PROCESSOS_DO_SELETOR = [['', 'Nenhum'], ...PROCESSOS.map((p) => [p.numero, p.numero])];
  const STATUS = { andamento: 'Em andamento', aguardando: 'Aguardando cliente', concluido: 'Concluído' };

  const atendimentos = ATENDIMENTOS.map((a) => ({ ...a, anotacoes: [...(ANOTACOES_DE_ATENDIMENTO[a.id] || [])] }));
  let criados = 0;
  let painel = null;
  let formulario = null;
  let botaoAdicionar = null;

  // --- utilidades -----------------------------------------------------------------

  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const reais = (valor) => valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const dataCurta = (iso) => new Date(`${iso.slice(0, 10)}T00:00`).toLocaleDateString('pt-BR');
  const dataEHora = (iso) => `${dataCurta(iso)} às ${iso.slice(11, 16)}`;
  const doisDigitos = (n) => String(n).padStart(2, '0');
  const horas = (h) => {
    const inteiras = Math.floor(h);
    const minutos = Math.round((h - inteiras) * 60);
    return minutos ? `${inteiras}h${doisDigitos(minutos)}` : `${inteiras}h`;
  };
  const isoDeAgora = () => {
    const d = new Date();
    return `${d.getFullYear()}-${doisDigitos(d.getMonth() + 1)}-${doisDigitos(d.getDate())}T${doisDigitos(d.getHours())}:${doisDigitos(d.getMinutes())}`;
  };
  const semAcento = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  function elemento(tag, classe, texto) {
    const el = document.createElement(tag);
    if (classe) el.className = classe;
    if (texto !== undefined) el.textContent = texto;
    return el;
  }

  function link(texto, href, classe) {
    const a = elemento('a', classe, texto);
    a.href = href;
    return a;
  }

  function avisar(tipo, mensagem) {
    const vaga = document.getElementById('pagina-aviso');
    if (vaga) vaga.replaceChildren(DS.faixaAviso({ tipo, mensagem, fechar: true }));
  }

  function juntar(nomes) {
    return nomes.length > 1 ? `${nomes.slice(0, -1).join(', ')} e ${nomes.at(-1)}` : nomes[0];
  }

  function chipStatus(status) {
    const el = DS.tag({ rotulo: STATUS[status] });
    el.classList.add('chip-status', `chip-status-${status}`);
    return el;
  }

  const enderecoDaFicha = (a) => `${PAGINA}?ficha=1&id=${encodeURIComponent(a.id)}`;
  const fichaDoProcesso = (numero) => `processos.html?ficha=${PROCESSOS.findIndex((p) => p.numero === numero) + 1}`;

  // PA-11 e PA-38: o número é texto, e copiar é um botão de ícone com dica.
  function copiarNumero(numero) {
    const botao = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'copiar', rotulo: 'Copiar número' });
    const envolto = DS.tooltip({ alvo: botao, rotulo: 'Copiar número' });
    const anuncio = elemento('span', 'visualmente-oculto');
    anuncio.setAttribute('role', 'status');
    botao.addEventListener('click', () => {
      const area = navigator.clipboard;
      const dizer = (texto) => { anuncio.textContent = texto; envolto.querySelector('.dica').textContent = texto; };
      if (!area) { dizer('Não foi possível copiar'); return; }
      area.writeText(numero).then(() => dizer('Número copiado'), () => dizer('Não foi possível copiar'));
    });
    envolto.append(anuncio);
    return envolto;
  }

  function numeroDoProcesso(numero) {
    return numero ? elemento('span', 'numero-processo', numero) : elemento('span', 'texto-apagado', 'Sem processo');
  }

  // --- formulário de adicionar (painel lateral) ----------------------------------

  // PA-84: sem Responsável e sem Acesso, como no Astrea, até a regra de negócio ser confirmada.
  function montarFormulario() {
    const valores = { clientes: [], assunto: '', etiqueta: '', processo: '', registro: '' };
    const opcoesClientes = CONTATOS.map((c) => [c.id, c.nome]);
    const campoClientes = () => DS.seletorMultiplo({
      rotulo: 'Clientes', obrigatorio: true, largura: 'total', opcoes: opcoesClientes, valor: valores.clientes,
      placeholder: 'Selecione um ou mais clientes', aoEscolher: (v) => { valores.clientes = v; },
    });
    const novoCliente = DS.botao({ variante: 'texto', tamanho: 'pequeno', iconeEsquerda: 'mais', rotulo: 'Adicionar cliente' });
    novoCliente.addEventListener('click', () => painel.trocar(conteudoDoNovoCliente()));
    const registro = DS.areaTexto({
      rotulo: '1º Registro do atendimento', obrigatorio: true, largura: 'total', linhas: 2,
      placeholder: 'Insira as anotações referentes ao atendimento', aoMudar: (v) => { valores.registro = v.trim(); },
    });
    registro.classList.add('registro-crescente');
    const pecas = {
      clientes: campoClientes(),
      novoCliente,
      assunto: DS.campo({
        rotulo: 'Assunto', obrigatorio: true, largura: 'total', placeholder: 'Digite um título para o seu atendimento',
        aoMudar: (v) => { valores.assunto = v.trim(); },
      }),
      etiqueta: DS.seletor({ rotulo: 'Etiqueta', opcoes: ETIQUETAS, aoEscolher: (v) => { valores.etiqueta = v; } }),
      processo: DS.seletor({
        rotulo: 'Processo, caso ou atendimento', largura: 'total', opcoes: PROCESSOS_DO_SELETOR,
        aoEscolher: (v) => { valores.processo = v; },
      }),
      registro,
    };
    return { valores, opcoesClientes, campoClientes, pecas };
  }

  function faltando() {
    const v = formulario.valores;
    return [[!v.clientes.length, 'Clientes'], [!v.assunto, 'Assunto'], [!v.registro, '1º Registro']]
      .filter(([falta]) => falta).map(([, nome]) => nome);
  }

  function nomesDosClientes(chaves) {
    return chaves.map((c) => formulario.opcoesClientes.find(([chave]) => chave === c)[1]).join(', ');
  }

  function conteudoDoFormulario() {
    const barra = DS.barraAcoes({
      rotulo: 'Ações do atendimento',
      acoes: [
        { variante: 'texto', rotulo: 'Cancelar', aoClicar: () => painel.fechar() },
        { variante: 'primario', rotulo: 'Salvar', aoClicar: () => salvar(barra) },
      ],
    });
    const p = formulario.pecas;
    return {
      titulo: 'Adicionar atendimento',
      corpo: [p.clientes, p.novoCliente, p.assunto, p.etiqueta, p.processo, p.registro],
      rodape: barra.el,
    };
  }

  // O cliente novo nasce dentro do mesmo painel (PA-27) e volta já escolhido.
  function conteudoDoNovoCliente() {
    let nome = '';
    const voltar = () => painel.trocar(conteudoDoFormulario());
    const criar = () => {
      if (!nome) { barra.definirSituacao('erro', 'Preencha o nome do cliente.'); return; }
      const chave = `novo-${++criados}`;
      formulario.opcoesClientes.push([chave, nome]);
      formulario.valores.clientes = [...formulario.valores.clientes, chave];
      formulario.pecas.clientes = formulario.campoClientes();
      voltar();
    };
    const barra = DS.barraAcoes({
      rotulo: 'Ações do cliente',
      acoes: [{ variante: 'secundario', rotulo: 'Voltar', aoClicar: voltar }, { variante: 'primario', rotulo: 'Criar cliente', aoClicar: criar }],
    });
    return {
      titulo: 'Adicionar cliente',
      corpo: [DS.campo({ rotulo: 'Nome do cliente', obrigatorio: true, largura: 'total', aoMudar: (v) => { nome = v.trim(); } })],
      rodape: barra.el,
    };
  }

  function salvar(barra) {
    const faltam = faltando();
    if (faltam.length) { barra.definirSituacao('erro', `Preencha ${juntar(faltam)}.`); return; }
    const v = formulario.valores;
    const agora = isoDeAgora();
    atendimentos.unshift({
      id: `novo-${++criados}`, assunto: v.assunto, cliente: nomesDosClientes(v.clientes), processo: v.processo,
      responsavel: EU, inicio: agora.slice(0, 10), status: 'andamento', area: '', honorarios: 0, horas: 0, documentos: 0,
      anotacoes: [{ autor: EU, em: agora, texto: v.registro }],
    });
    painel.fechar();
    if (redesenharLista) redesenharLista();
    avisar('sucesso', `Atendimento "${v.assunto}" adicionado.`);
  }

  function abrirFormulario() {
    formulario = montarFormulario();
    const conteudoDoPainel = conteudoDoFormulario();
    if (painel) painel.trocar(conteudoDoPainel);
    else painel = DS.painelLateral(conteudoDoPainel);
    painel.abrir(botaoAdicionar);
  }

  // --- lista ----------------------------------------------------------------------

  let redesenharLista = null;

  function montarLista() {
    const PADRAO = { busca: '', status: 'todos', responsavel: 'todos' };
    const filtro = { ...PADRAO };
    const FILTROS = {
      status: { rotulo: 'Status', opcoes: [['todos', 'Todos os status'], ...Object.entries(STATUS)] },
      responsavel: { rotulo: 'Responsável', opcoes: [['todos', 'Todas as pessoas'], ...RESPONSAVEIS.map((n) => [n, n])] },
    };
    let barra;

    const ativos = () => Object.keys(PADRAO).filter((c) => filtro[c] !== PADRAO[c]).length;
    const visiveis = () => atendimentos.filter((a) => {
      const termo = semAcento(filtro.busca.trim());
      const texto = semAcento(`${a.assunto} ${a.cliente} ${a.processo}`);
      return (!termo || texto.includes(termo))
        && (filtro.status === 'todos' || a.status === filtro.status)
        && (filtro.responsavel === 'todos' || a.responsavel === filtro.responsavel);
    });

    const lugarDaBarra = elemento('div', 'lista-filtros');
    const aviso = elemento('div', 'pagina-aviso');
    aviso.id = 'pagina-aviso';
    const lugarDaTabela = elemento('div', 'atendimentos-resultado');
    lugarDaTabela.id = 'atendimentos-resultado';
    let visao = lerVisao();
    const detalhe = detalheAoLado({
      prefixo: 'astrea-atendimentos', lista: lugarDaTabela, dados: dadosDoDetalhe, urlDaFicha: enderecoDaFicha,
      rotulo: 'Atendimento escolhido',
      rotulos: { anterior: 'Atendimento anterior da lista', proximo: 'Próximo atendimento da lista',
        esconder: 'Esconder o painel do atendimento', mostrar: 'Mostrar o painel do atendimento' },
      largura: 'Largura do painel do atendimento',
    });
    conteudo.replaceChildren(lugarDaBarra, aviso, detalhe.casca);

    botaoAdicionar = DS.botao({ variante: 'primario', iconeEsquerda: 'mais', rotulo: 'Adicionar atendimento' });
    botaoAdicionar.setAttribute('data-abre-painel', '');
    botaoAdicionar.setAttribute('aria-haspopup', 'dialog');
    botaoAdicionar.addEventListener('click', abrirFormulario);

    function celulas(a) {
      return {
        assunto: link(a.assunto, enderecoDaFicha(a)),
        cliente: a.cliente,
        processo: numeroDoProcesso(a.processo),
        responsavel: DS.avatar({ nome: a.responsavel, mostrarNome: true }),
        inicio: dataCurta(a.inicio),
        status: chipStatus(a.status),
      };
    }

    function desenhar() {
      const lista = visiveis();
      const total = ativos();
      const resultado = total ? `${lista.length} de ${plural(atendimentos.length, 'atendimento', 'atendimentos')}`
        : plural(lista.length, 'atendimento', 'atendimentos');
      barra.atualizar({ resultado, ativos: total });
      const vazio = atendimentos.length
        ? { titulo: 'Nenhum atendimento com estes filtros.', texto: 'Os filtros escondem o que houver aqui.',
          acao: { rotulo: 'Limpar filtros', variante: 'secundario', aoClicar: limpar } }
        : { titulo: 'Agilize e organize seus atendimentos',
          texto: 'Registre conversas com seus clientes, adicione documentos e crie atividades de forma descomplicada.' };
      lugarDaTabela.dataset.visao = visao;
      if (visao === 'cards') {
        lugarDaTabela.replaceChildren(lista.length ? desenharCards(lista) : DS.estadoVazio(vazio));
      } else {
        const tabela = DS.tabela({
          rotulo: 'Atendimentos',
          colunas: [['assunto', 'Assunto'], ['cliente', 'Cliente'], ['processo', 'Processo'], ['responsavel', 'Responsável'],
            ['inicio', 'Início'], ['status', 'Status']],
          linhas: lista.map(celulas),
          vazio,
        });
        if (lista.length) linhasSelecionaveis(tabela, lista);
        lugarDaTabela.replaceChildren(tabela);
      }
      detalhe.sincronizar(lista);
    }

    // Card de registro do DS: o assunto segue para a ficha, o processo copia, o resto do card escolhe.
    function cardDoAtendimento(a) {
      return DS.cardRegistro({
        titulo: a.assunto,
        href: enderecoDaFicha(a),
        chip: chipStatus(a.status),
        destaque: a.processo ? { rotulo: 'Processo', valor: a.processo, copiar: a.processo } : { rotulo: 'Processo', valor: 'Sem processo' },
        linhas: [
          { rotulo: 'Cliente', valor: a.cliente },
          { rotulo: 'Responsável', valor: a.responsavel, pessoa: true },
          { rotulo: 'Início', valor: dataCurta(a.inicio) },
        ],
        rodape: a.area ? [DS.tag({ rotulo: a.area })] : [],
        selecionavel: true,
      });
    }

    function desenharCards(itens) {
      const ul = elemento('ul', 'atendimentos-cards');
      ul.setAttribute('aria-label', 'Atendimentos');
      ul.append(...itens.map((a) => {
        const li = elemento('li');
        li.dataset.id = String(a.id);
        li.append(cardDoAtendimento(a));
        return li;
      }));
      return ul;
    }

    // --- formato: radiogroup com foco itinerante (o mesmo de contatos.html) -------

    const formato = elemento('div', 'formato');
    formato.setAttribute('role', 'radiogroup');
    formato.setAttribute('aria-label', 'Formato da lista');
    const opcoesDeFormato = VISOES.map(([chave, rotulo]) => {
      const el = elemento('button', 'formato-opcao', rotulo);
      el.type = 'button';
      el.setAttribute('role', 'radio');
      el.dataset.visao = chave;
      el.setAttribute('aria-controls', 'atendimentos-resultado');
      el.addEventListener('click', () => escolherVisao(chave));
      return el;
    });
    formato.append(...opcoesDeFormato);
    formato.addEventListener('keydown', (e) => {
      const passo = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!passo) return;
      e.preventDefault();
      const atual = VISOES.findIndex(([chave]) => chave === visao);
      escolherVisao(VISOES[(atual + passo + VISOES.length) % VISOES.length][0], true);
    });

    function marcarVisao() {
      opcoesDeFormato.forEach((el) => {
        const marcada = el.dataset.visao === visao;
        el.setAttribute('aria-checked', String(marcada));
        el.tabIndex = marcada ? 0 : -1;
      });
    }

    function escolherVisao(nova, focar) {
      visao = nova;
      gravar(CHAVE_VISAO, nova);
      marcarVisao();
      desenhar();
      if (focar) opcoesDeFormato.find((el) => el.dataset.visao === nova).focus();
    }

    function anotacoesRecentes(a) {
      const secao = elemento('section', 'detalhe-anotacoes');
      const recentes = [...a.anotacoes].sort((x, y) => y.em.localeCompare(x.em)).slice(0, 2);
      const titulo = elemento('h3', 'detalhe-anotacoes-titulo', 'Anotações mais recentes');
      if (!recentes.length) {
        secao.append(titulo, DS.estadoVazio({ titulo: 'Nenhuma anotação ainda.', texto: 'O registro das conversas aparece aqui.' }));
        return secao;
      }
      const ol = elemento('ol', 'anotacoes');
      ol.setAttribute('aria-label', 'As duas anotações mais recentes');
      ol.append(...recentes.map((n) => itemDeAnotacao(n)));
      secao.append(titulo, ol);
      return secao;
    }

    function dadosDoDetalhe(a) {
      let processo = '';
      if (a.processo) {
        processo = elemento('span', 'detalhe-numero');
        processo.append(link(a.processo, fichaDoProcesso(a.processo), 'numero-processo'), copiarNumero(a.processo));
      }
      const ficha = enderecoDaFicha(a);
      return {
        titulo: a.assunto, chips: [chipStatus(a.status)],
        destaque: { rotulo: 'Cliente', valor: a.cliente },
        linhas: [
          { icone: 'info', rotulo: 'Processo', valor: processo },
          { icone: 'pessoa', rotulo: 'Responsável', valor: DS.avatar({ nome: a.responsavel, mostrarNome: true }) },
          { icone: 'calendario', rotulo: 'Início', valor: dataCurta(a.inicio) },
          { icone: 'marca', rotulo: 'Etiqueta', valor: a.area || '' },
          { icone: 'info', rotulo: 'Honorários', valor: a.honorarios ? reais(a.honorarios) : 'Sem honorários' },
          { icone: 'relogio', rotulo: 'Timesheets', valor: a.horas ? horas(a.horas) : '0h' },
          { icone: 'arquivar', rotulo: 'Documentos', valor: plural(a.documentos || 0, 'documento', 'documentos') },
          { icone: 'editar', rotulo: 'Anotações', valor: plural(a.anotacoes.length, 'anotação', 'anotações') },
        ],
        corpo: [anotacoesRecentes(a)],
        acoes: [
          { variante: 'secundario', iconeEsquerda: 'mais', rotulo: 'Nova anotação', aoClicar: () => { location.href = `${ficha}&anotar=1`; } },
          { variante: 'primario', rotulo: 'Abrir ficha', aoClicar: () => { location.href = ficha; } },
        ],
      };
    }

    function limpar() {
      Object.assign(filtro, PADRAO);
      montarBarra();
      desenhar();
      lugarDaBarra.querySelector('input').focus();
    }

    function montarBarra() {
      const busca = DS.busca({ rotulo: 'Buscar atendimento', placeholder: 'Assunto, cliente ou processo', valor: filtro.busca,
        aoMudar: (v) => { filtro.busca = v; desenhar(); } });
      const status = DS.seletor({ rotulo: FILTROS.status.rotulo, opcoes: FILTROS.status.opcoes, valor: filtro.status, largura: 'p',
        aoEscolher: (valor) => { filtro.status = valor; desenhar(); } });
      status.dataset.filtro = 'status';
      // Responsável vai para o Filtro avançado, para a barra caber numa linha (padrão de contatos.html).
      const avancado = DS.botao({ variante: 'secundario', rotulo: 'Filtro avançado' });
      avancado.setAttribute('data-abre-painel', '');
      avancado.setAttribute('aria-haspopup', 'dialog');
      avancado.addEventListener('click', () => abrirAvancado(avancado));
      barra = DS.barraFiltros({ rotulo: 'Filtros de atendimentos', itens: [busca, status, avancado], aoLimpar: limpar, visao: formato, acoes: [botaoAdicionar] });
      lugarDaBarra.replaceChildren(barra.el);
    }

    let painelDoFiltro = null;
    function abrirAvancado(origem) {
      const rascunho = { responsavel: filtro.responsavel };
      const cancelar = DS.botao({ variante: 'texto', rotulo: 'Cancelar' });
      cancelar.addEventListener('click', () => painelDoFiltro.fechar());
      const aplicar = DS.botao({ variante: 'primario', rotulo: 'Aplicar' });
      aplicar.addEventListener('click', () => {
        filtro.responsavel = rascunho.responsavel;
        painelDoFiltro.fechar();
        desenhar();
      });
      const responsavel = DS.seletor({ rotulo: FILTROS.responsavel.rotulo, opcoes: FILTROS.responsavel.opcoes,
        valor: rascunho.responsavel, aoEscolher: (v) => { rascunho.responsavel = v; } });
      responsavel.dataset.filtro = 'responsavel';
      const conteudoDoFiltro = { titulo: 'Filtro avançado', corpo: [responsavel], rodape: DS.grupoBotoes([cancelar, aplicar]) };
      if (!painelDoFiltro) painelDoFiltro = DS.painelLateral(conteudoDoFiltro);
      else painelDoFiltro.trocar(conteudoDoFiltro);
      painelDoFiltro.abrir(origem);
    }

    redesenharLista = desenhar;
    montarBarra();
    marcarVisao();
    desenhar();
    detalhe.divisor.ajustar();
  }

  // --- detalhe ao lado da lista (mesmo padrão de contatos.html) -------------------

  const ESTREITA = window.matchMedia('(max-width: 1100px)');
  const LISTA_MINIMA = 480;
  const CHAVE_VISAO = 'astrea-atendimentos-visao';
  const VISOES = [['tabela', 'Tabela'], ['cards', 'Cards']];

  function lerVisao() {
    const salva = ler(CHAVE_VISAO);
    return VISOES.some(([chave]) => chave === salva) ? salva : 'tabela';
  }

  function ler(chave) {
    try { return localStorage.getItem(chave); } catch (e) { return null; }
  }

  function gravar(chave, valor) {
    try { localStorage.setItem(chave, valor); } catch (e) { /* sem armazenamento */ }
  }

  // O link da primeira coluna segue para a ficha; o resto da linha escolhe o item do painel.
  function linhasSelecionaveis(tabela, itens) {
    tabela.querySelectorAll('tbody tr').forEach((tr, i) => {
      if (!itens[i]) return;
      tr.dataset.id = String(itens[i].id);
      tr.dataset.selecionavel = '';
      tr.tabIndex = 0;
    });
  }

  // Sem escolha gravada, o primeiro da lista. Se o filtro tira o escolhido, mostra o primeiro.
  function detalheAoLado({ prefixo, lista, dados, urlDaFicha, rotulo, rotulos, largura }) {
    const CHAVE_ID = `${prefixo}-detalhe-id`;
    const CHAVE_OCULTO = `${prefixo}-detalhe-oculto`;
    let escolhido = ler(CHAVE_ID);
    let itens = [];
    const atual = () => itens.find((x) => String(x.id) === escolhido) || itens[0];
    function andar(passo) {
      const i = itens.indexOf(atual());
      escolher(String(itens[(i + passo + itens.length) % itens.length].id));
    }
    const painel = DS.painelDetalhe({
      rotulo, rotulos,
      aoAnterior: () => andar(-1),
      aoProximo: () => andar(1),
      aoFechar: () => { gravar(CHAVE_OCULTO, '1'); divisor.el.hidden = true; },
      aoReabrir: () => { gravar(CHAVE_OCULTO, ''); divisor.el.hidden = false; },
    });
    painel.el.id = `${prefixo.replace('astrea-', '')}-detalhe`;
    const divisor = DS.divisorRedimensionavel({
      alvo: painel.el, rotulo: largura, minimo: 300, maximo: 560, padrao: 380,
      chave: `${prefixo}-detalhe-largura`, reserva: LISTA_MINIMA,
    });
    const casca = elemento('div', 'lista-e-detalhe');
    casca.append(lista, divisor.el, painel.el);
    if (ler(CHAVE_OCULTO) === '1') { painel.esconder(); divisor.el.hidden = true; }

    function sincronizar(novos) {
      itens = novos;
      const x = atual();
      painel.el.hidden = !x;
      divisor.el.hidden = !x || painel.oculto();
      const id = x ? String(x.id) : '';
      lista.querySelectorAll('tbody tr[data-id]').forEach((tr) => tr.setAttribute('aria-selected', String(tr.dataset.id === id)));
      lista.querySelectorAll('li[data-id] > .card-registro').forEach((card) => {
        const sim = card.parentElement.dataset.id === id;
        card.classList.toggle('is-selecionado', sim);
        if (sim) card.setAttribute('aria-current', 'true');
        else card.removeAttribute('aria-current');
      });
      if (x) painel.mostrar({ ...dados(x), navegavel: itens.length > 1 });
    }

    function escolher(id) {
      const x = itens.find((item) => String(item.id) === id);
      if (!x) return;
      if (ESTREITA.matches) { location.href = urlDaFicha(x); return; }
      escolhido = id;
      gravar(CHAVE_ID, id);
      if (painel.oculto()) { painel.reabrir(); divisor.el.hidden = false; gravar(CHAVE_OCULTO, ''); }
      sincronizar(itens);
    }

    // Linha da tabela ou card: o mesmo clique e o mesmo Enter escolhem o item do painel.
    lista.addEventListener('click', (e) => {
      const item = e.target.closest('tr[data-id], li[data-id]');
      if (item && !e.target.closest('a, button')) escolher(item.dataset.id);
    });
    lista.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || !e.target.matches('tr[data-id], li[data-id] > .card-registro')) return;
      e.preventDefault();
      escolher(e.target.closest('[data-id]').dataset.id);
    });
    return { casca, divisor, sincronizar };
  }

  // --- ficha ----------------------------------------------------------------------

  function cabecalhoDeSegundoNivel(titulo) {
    const lugar = document.querySelector('.titulo-cabecalho');
    const h1 = lugar.querySelector('h1');
    h1.after(DS.trilha({ itens: [{ rotulo: MODULO, pagina: PAGINA }] }));
    h1.textContent = titulo;
    document.title = `${titulo}, Astrea: protótipo`;
  }

  let blocos = 0;
  function bloco(titulo, ...corpo) {
    const sec = elemento('section', 'bloco');
    const cabeca = elemento('div', 'bloco-cabeca');
    const h = elemento('h2', null, titulo);
    h.id = `bloco-${++blocos}`;
    sec.setAttribute('aria-labelledby', h.id);
    cabeca.append(h);
    sec.append(cabeca, ...corpo);
    return { sec, cabeca };
  }

  function botaoMais(rotulo, aoClicar) {
    const el = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'mais', rotulo });
    el.addEventListener('click', () => aoClicar(el));
    return DS.tooltip({ alvo: el, rotulo });
  }

  function itemDeAnotacao(n, nova = false) {
    const li = elemento('li', nova ? 'anotacao-nova' : null);
    const trilho = elemento('div', 'anotacao-trilho');
    const foto = DS.avatar({ nome: n.autor });
    foto.setAttribute('aria-hidden', 'true');
    foto.removeAttribute('role');
    foto.removeAttribute('aria-label');
    trilho.append(foto);
    const corpo = elemento('div', 'anotacao-corpo');
    const cabeca = elemento('p', 'anotacao-cabeca');
    const quando = elemento('time', null, dataEHora(n.em));
    quando.dateTime = n.em;
    cabeca.append(elemento('span', 'anotacao-autor', n.autor), quando);
    corpo.append(cabeca, elemento('p', 'anotacao-texto', n.texto));
    li.append(trilho, corpo);
    return li;
  }

  function montarFicha(a) {
    cabecalhoDeSegundoNivel(a.assunto);
    const foraDoPrototipo = (texto) => () => avisar('info', texto);

    // Cabeçalho: Início, Status, Processo, Responsável; depois a etiqueta de área.
    const leitura = elemento('dl', 'ficha-leitura');
    const par = (rotulo, ...valor) => {
      const div = elemento('div');
      const dd = elemento('dd');
      dd.append(...valor);
      div.append(elemento('dt', null, rotulo), dd);
      leitura.append(div);
    };
    par('Início', dataCurta(a.inicio));
    par('Status', chipStatus(a.status));
    par('Processo', a.processo ? link(a.processo, fichaDoProcesso(a.processo), 'numero-processo') : numeroDoProcesso(''));
    par('Responsável', DS.avatar({ nome: a.responsavel, mostrarNome: true }));

    const etiquetas = elemento('p', 'ficha-etiquetas');
    if (a.area) {
      const tag = DS.tag({ rotulo: a.area });
      const remover = DS.botao({ variante: 'icone', tamanho: 'pequeno', iconeEsquerda: 'fechar', rotulo: `Remover etiqueta ${a.area}` });
      remover.addEventListener('click', foraDoPrototipo(`Remover a etiqueta "${a.area}" fica fora do protótipo.`));
      tag.append(remover);
      etiquetas.append(tag);
    } else {
      etiquetas.append(elemento('span', 'texto-apagado', 'Sem etiqueta'));
    }
    const topo = elemento('div', 'ficha-topo');
    topo.append(leitura, etiquetas);

    const aviso = elemento('div', 'pagina-aviso');
    aviso.id = 'pagina-aviso';

    // Esquerda: linha do tempo e o compositor.
    const contagem = elemento('p', 'bloco-nota');
    const linhaDoTempo = elemento('ol', 'anotacoes');
    linhaDoTempo.setAttribute('aria-label', 'Anotações, da mais recente para a mais antiga');
    const desenharContagem = () => { contagem.textContent = plural(a.anotacoes.length, 'anotação', 'anotações'); };
    linhaDoTempo.append(...[...a.anotacoes].reverse().map((n) => itemDeAnotacao(n)));
    desenharContagem();

    let texto = '';
    const area = DS.areaTexto({ rotulo: 'Anotação', largura: 'total', linhas: 3,
      placeholder: 'Escreva o que foi conversado com o cliente', aoMudar: (v) => { texto = v.trim(); } });
    const barra = DS.barraAcoes({ rotulo: 'Ações da anotação', acoes: [
      { variante: 'primario', rotulo: 'Salvar', aoClicar: () => {
        if (!texto) { barra.definirSituacao('erro', 'Escreva a anotação antes de salvar.'); return; }
        const nova = { autor: EU, em: isoDeAgora(), texto };
        a.anotacoes.push(nova);
        linhaDoTempo.prepend(itemDeAnotacao(nova, true));
        desenharContagem();
        const entrada = area.querySelector('textarea');
        entrada.value = '';
        entrada.dispatchEvent(new Event('input', { bubbles: true }));
        texto = '';
        barra.definirSituacao('salvo', 'Anotação salva no topo da linha do tempo.');
      } },
    ] });
    const compositor = elemento('div', 'compositor');
    compositor.append(area, barra.el);
    // "Nova anotação" do painel da lista chega aqui com o foco no compositor.
    if (parametros.get('anotar') === '1') requestAnimationFrame(() => area.querySelector('textarea').focus());
    const anotacoes = bloco('Anotações', contagem, linhaDoTempo, compositor);

    const esquerda = elemento('div', 'ficha-coluna');
    esquerda.append(anotacoes.sec);

    // Direita: participantes, valores e atividades ligadas ao processo.
    const participantes = elemento('ul', 'participantes');
    [[a.responsavel, 'Responsável'], [a.cliente, 'Cliente']].forEach(([nome, papel]) => {
      const li = elemento('li');
      li.append(DS.avatar({ nome, mostrarNome: true }), elemento('span', 'participante-papel', papel));
      participantes.append(li);
    });
    const valor = (principal, nota) => {
      const frag = [elemento('p', 'bloco-valor', principal)];
      if (nota) frag.push(elemento('p', 'bloco-nota', nota));
      return frag;
    };
    const daqui = a.processo ? ATIVIDADES.filter((t) => t.processo === a.processo).sort((x, y) => x.prazoEmDias - y.prazoEmDias) : [];
    let tarefas;
    if (daqui.length) {
      tarefas = elemento('ul', 'lista-atividades');
      tarefas.append(...daqui.map((t) => {
        const prazo = DS.descreverPrazo(t.prazoEmDias, t.status === 'concluido');
        return DS.linhaAtividade({ titulo: t.titulo, tipo: t.tipo, estadoPrazo: prazo.estadoPrazo, prazo: prazo.rotulo,
          responsavel: t.responsavel, mostrarProcesso: false });
      }));
    } else {
      tarefas = DS.estadoVazio({ titulo: 'Ainda não existem tarefas ou eventos neste atendimento' });
    }

    const lateral = [
      ['Participantes', [participantes], 'Adicionar participante', foraDoPrototipo('Adicionar participante fica fora do protótipo.')],
      ['Honorários', valor(a.honorarios ? reais(a.honorarios) : 'Sem honorários', a.honorarios ? 'Contrato de honorários do atendimento' : ''),
        'Adicionar honorário', foraDoPrototipo('Lançar honorários fica no Financeiro, fora do protótipo.')],
      ['Timesheets', valor(a.horas ? horas(a.horas) : '0h', 'Horas lançadas neste atendimento'),
        'Adicionar timesheet', foraDoPrototipo('Lançar horas fica fora do protótipo.')],
      ['Documentos', valor(plural(a.documentos, 'documento', 'documentos')),
        'Adicionar documento', foraDoPrototipo('Enviar documentos fica fora do protótipo.')],
      ['Tarefas e eventos', [tarefas], 'Adicionar tarefa ou evento', (origem) => DS.painelCriarAtividade({ tipo: 'tarefa' }).abrir(origem)],
    ];
    const direita = elemento('div', 'ficha-coluna');
    lateral.forEach(([titulo, corpo, rotulo, aoClicar]) => {
      const b = bloco(titulo, ...corpo);
      const mais = botaoMais(rotulo, aoClicar);
      if (titulo === 'Tarefas e eventos') {
        const alvo = mais.querySelector('button');
        alvo.setAttribute('data-abre-painel', '');
        alvo.setAttribute('aria-haspopup', 'dialog');
      }
      b.cabeca.append(mais);
      direita.append(b.sec);
    });

    const grade = elemento('div', 'ficha-grade');
    grade.append(esquerda, direita);
    conteudo.replaceChildren(topo, aviso, grade);
  }

  // --- rota -----------------------------------------------------------------------

  if (parametros.get('ficha') !== null) {
    const id = parametros.get('id');
    montarFicha(atendimentos.find((a) => a.id === id) || atendimentos[0]);
  } else {
    montarLista();
    if (parametros.get('adicionar') === '1') abrirFormulario();
  }
})();
</script>
</body>
</html>
